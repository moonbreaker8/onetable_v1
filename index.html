/* 원테이블 DealFlow — 유진투자증권 CI 기반 디자인 시스템
 * 레드는 포인트(로고·주요 버튼·딜러 자리·경고)에만. 상태색은 레드와 구분되는 톤. */


:root {
  --red: #C02024;            /* brand/ci_colors.txt (워드마크 추출값) */
  --red-weak: #FBEAEA;
  --ink: #1F2328;
  --ink-2: #3A4049;
  --muted: #5F6773;
  --faint: #8C939D;
  --line: #E2E5EA;
  --line-2: #EEF0F3;
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --green: #1E7B4E; --green-weak: #E6F4EC;
  --amber: #A86A0C; --amber-weak: #FDF3E1;
  --blue: #2560A8; --blue-weak: #E8F0FA;
  --danger: #7A1E2A; --danger-weak: #F6E7EA;  /* 버건디 — 레드보다 어둡게 */
  --violet: #5B4BA6; --violet-weak: #EFECFA;
  --r: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .12);
  --font: "Pretendard Variable", Pretendard, "Pretendard Local", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --tabbar: 64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.num, .tab-num { font-variant-numeric: tabular-nums; }
abbr[title] { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: help; }
a { color: var(--blue); }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 750; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.grow { flex: 1; min-width: 0; }
.hide { display: none !important; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.break { word-break: keep-all; overflow-wrap: anywhere; }

/* ── 셸 ── */
.app { min-height: 100vh; }
.hdr { position: sticky; top: 0; z-index: 40; height: 56px; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.hdr .brand { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px; min-width: 0; }
.hdr .brand img { height: 22px; width: auto; display: block; }
.hdr .brand .prod { font-weight: 750; font-size: 14px; color: var(--ink-2); padding-left: 10px; border-left: 1px solid var(--line); white-space: nowrap; }
.hdr .spacer { flex: 1; }
.busy { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.busy::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.seat-btn { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; max-width: 220px; }
.seat-btn .who { text-align: left; line-height: 1.15; min-width: 0; }
.seat-btn .who b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-btn .who span { font-size: 11px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: grid; place-items: center; font-size: 20px; color: var(--ink-2); position: relative; }
.icon-btn:hover { background: var(--line-2); }
.dot-badge { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.nav { position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; border-right: 1px solid var(--line); background: #fff; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; }
.nav a:hover { background: var(--line-2); }
.nav a.on { background: var(--red-weak); color: var(--red); }
.nav a .ico { width: 22px; text-align: center; }
.nav a .cnt { margin-left: auto; font-size: 11px; background: var(--red); color: #fff; border-radius: 9px; padding: 1px 7px; }
.nav .sep { height: 1px; background: var(--line); margin: 10px 6px; }
.nav .navfoot { margin-top: auto; padding: 10px 6px 0; }
.main { min-width: 0; padding: 22px 28px 40px; }
.main-inner { max-width: 1240px; margin: 0 auto; }
.foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); text-align: center; }

.tabbar { display: none; }
@media (max-width: 1023px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  .main { padding: 16px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--line); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; position: relative; min-height: 44px; }
  .tabbar a .ico { font-size: 19px; line-height: 1; }
  .tabbar a.on { color: var(--red); }

.seat-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; min-height: 56px; text-align: left; width: 100%; }

.modal.sm { width: min(480px, 100%); }

.modal-b { padding: 16px 18px; overflow-y: auto; }
.viewer .pg { margin-bottom: 18px; }
.viewer .pg h4 { font-size: 12px; color: var(--faint); margin-bottom: 6px; font-weight: 700; border-bottom: 1px solid var(--line-2); padding-bottom: 4px; }
.viewer .ln { font-size: 14px; padding: 2px 6px; border-radius: 4px; }
.viewer .ln.hd { font-weight: 750; margin-top: 8px; }
.viewer mark, .viewer .ln.hl { background: #FFE768; box-shadow: 0 0 0 2px #FFE768; color: var(--ink); }
.viewer tr.hl td { background: #FFE768; }
.viewer tr.add td { background: var(--green-weak); }
@media (max-width: 639px) { .modal-bg { padding: 0; align-items: flex-end; } .modal { border-radius: 16px 16px 0 0; max-height: 92vh; } }

/* ── 토스트 ── */
.toasts { position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(520px, calc(100vw - 32px)); }
@media (max-width: 1023px) { .toasts { bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom)); } }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow-lg); animation: tin .25s ease; max-width: 100%; }
.toast.warn { background: #6F4806; }
.toast.ok { background: #145236; }
.toast.red { background: var(--red); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

/* ── 메뉴 ── */
.menu { position: fixed; z-index: 75; top: 52px; right: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; width: 240px; }
.menu a, .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-align: left; }
.menu a:hover, .menu button:hover { background: var(--line-2); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.seatpick { width: 300px; max-height: calc(100vh - 80px); overflow-y: auto; }
.seatpick button .av { width: 30px; height: 30px; font-size: 11px; margin: 0; border-width: 0; flex: none; }

/* ── 시연 패널 ── */
.fab { position: fixed; z-index: 60; right: 18px; bottom: 18px; min-height: 48px; padding: 0 18px; border-radius: 24px; border: 0; background: var(--ink); color: #fff; font-weight: 750; box-shadow: var(--shadow-lg); cursor: pointer; font-size: 14px; }
@media (max-width: 1023px) { .fab { bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); right: 12px; min-height: 44px; } }
.demo { position: fixed; z-index: 65; right: 18px; bottom: 76px; width: 340px; max-width: calc(100vw - 24px); max-height: calc(100vh - 100px); overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 14px; }
@media (max-width: 1023px) { .demo { right: 12px; bottom: calc(var(--tabbar) + 70px); max-height: calc(100vh - 160px); } }
.demo .stp { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.demo .stp .n { width: 24px; height: 24px; border-radius: 50%; background: var(--line-2); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.demo .stp.done .n { background: var(--green); color: #fff; }
.demo .stp.run .n { background: var(--red); color: #fff; animation: blink 1s infinite; }
.demo .stp.next .n { box-shadow: 0 0 0 2px var(--red); }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11px; background: var(--line-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

/* ── 스테이지 뷰 ── */
.stage { min-height: 100vh; background: #E9ECF0; display: flex; flex-direction: column; }
.stage-h { height: 56px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 18px; }
.stage-h img { height: 22px; }
.frames { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 22px; padding: 16px 380px 16px 16px; }
.pf { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pf .lbl { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px; }
.pf select { min-height: 32px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 13px; padding: 0 6px; }
.phone { width: 390px; height: 800px; border-radius: 44px; background: #111; padding: 12px; box-shadow: 0 20px 50px rgba(16, 24, 40, .25); transform-origin: top center; position: relative; }
.phone::before { content: ""; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 64px; height: 4px; background: #3A3A3A; border-radius: 2px; z-index: 2; }
.phone iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: #fff; }
.stage .demo { top: 72px; bottom: auto; right: 16px; max-height: calc(100vh - 88px); }

  <script>window.__ONEFILE__ = {"samples":{"01_대출약정서.pdf":{"name":"01_대출약정서.pdf","size":115780,"kind":"pdf","pages":[{"page":1,"lines":["대출약정서 (가상)","가상 A홀딩스 - B기업 인수금융 · Tranche A / Tranche B","차주: A홀딩스 주식회사 / 대주: 별표 2 기재 대주단 / 대리금융기관: 유진투자증권","본 약정서는 2026 AX 해커톤 시연을 위해 작성된 가상 문서이며 실제 거래·회사·인물과 무관하다.","제1조(정의)","① \"영업일\"이란 서울에서 시중은행이 일반 영업을 하는 날을 말하며, 토요일·일요일 및 법정공휴일은 제외한다.","② \"차주\"란 A홀딩스 주식회사를, \"대상회사\"란 B기업 주식회사를, \"스폰서\"란 가상PE파트너스를 말한다.","③ \"대리금융기관\"이란 유진투자증권을 말한다.","④ \"트랜치\"란 Tranche A 대출과 Tranche B 대출을 말한다."],"heads":[0,4]},{"page":2,"lines":["제2조(대출금)","① 대주단은 본 약정에 따라 차주에게 총 금 오백억원(₩50,000,000,000)을 한도로 대출한다.","② 대출금은 Tranche A 300억원과 Tranche B 200억원으로 구성한다.","③ 각 대주의 참여금액은 별표 2와 같다.","제3조(약정체결 및 인출)","① 본 약정의 약정체결일은 2026년 11월 17일로 한다.","② 인출예정일은 2026년 11월 20일로 하며, 제10조의 인출선행조건이 모두 충족된 경우에 인출할 수 있다.","③ 대출금은 대상회사 주식 인수대금 및 부대비용에 사용한다."],"heads":[0,4]},{"page":3,"lines":["제4조(만기)","대출의 만기일은 최초 인출일로부터 5년이 되는 날로 하며, 그 날이 영업일이 아닌 경우 다음 영업일로 한다.","제5조(상환)","① Tranche A 대출은 별표 1 분할상환표에 따라 분할상환한다.","② Tranche B 대출은 만기일에 전액 만기일시상환한다.","③ 상환일이 영업일이 아닌 경우 그 다음 영업일에 상환한다."],"heads":[0,2]},{"page":4,"lines":["제6조(이자율)","대출의 이자율은 연 6.2%(고정금리)로 하고, 연 365일 기준 일할 계산한다.","제7조(이자의 지급)","차주는 최초 인출일이 속한 달의 다음 달부터 매월 20일에 이자를 지급한다.","이자기간은 직전 이자지급일(최초는 인출일)부터 다음 이자지급일 전날까지로 한다.","제8조(영업일 조정)","이자지급일이 영업일이 아닌 경우 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산한다."],"heads":[0,2,5]},{"page":5,"lines":["제9조(조기상환)","① 차주는 10영업일 전 서면 통지로 대출금의 전부 또는 일부를 조기상환할 수 있다.","② 최초 인출일로부터 1년 이내 조기상환하는 경우 상환금액의 1.0%를 조기상환수수료로 지급한다. 1년 경과 후에는 수수료가 없다.","제10조(인출선행조건)","대주단의 인출 의무는 다음 각 호의 서류가 대리금융기관이 만족하는 형식과 내용으로 제출되는 것을 조건으로 한다.","CP-01 이사회 의사록: 본 약정에 따른 차입 및 담보 제공을 승인하는 차주 이사회 결의 의사록 사본","CP-02 법인등기사항전부증명서: 발급일로부터 1개월 이내의 차주 법인등기사항전부증명서","CP-03 주식근질권설정계약서: 대상회사 주식에 대한 근질권설정계약서 체결본","CP-04 법률의견서: 차주측 법률자문사의 법률의견서","CP-05 인감증명서: 차주의 법인인감증명서 및 사용인감계"],"heads":[0,3]},{"page":6,"lines":["제11조(후행조건)","차주는 인출 후 다음 각 호의 서류를 정해진 기한 내에 대리금융기관에 제출하여야 한다.","PC-01 인수대금 지급 확인서: 인출일로부터 5영업일 이내 대상회사 주식 인수대금 지급 확인서 제출","PC-02 담보 관련 확인자료: 인출일로부터 14일 이내 질권설정 승낙서 및 확정일자 부여 증빙 제출","제12조(재무약정)","① 차주는 대출기간 동안 연결재무제표 기준으로 다음 재무비율을 유지하여야 한다.","1. 레버리지비율(순차입금/EBITDA): 5.0배 이하","2. 이자보상비율(EBITDA/이자비용): 2.0배 이상","② 재무약정의 측정기준일은 매 회계분기 종료일로 하며, 최초 측정기준일은 2027년 3월 31일로 한다."],"heads":[0,4]},{"page":7,"lines":["제13조(정보제공의무)","차주는 각 회계분기 종료일로부터 45일 이내에 분기 재무제표 및 재무약정 준수확인서를 제출하여야 한다.","제출기한의 마지막 날이 영업일이 아닌 경우 그 다음 영업일까지 제출한다.","제14조(기한이익상실)","다음 각 호의 사유(EOD)가 발생하면 대리금융기관은 대주단 결의에 따라 기한의 이익 상실을 선언할 수 있다.","1. 원리금 지급기일로부터 5영업일 이내에 원리금을 지급하지 아니한 경우","2. 제12조의 재무약정을 위반하고 30일 이내에 치유하지 아니한 경우","3. 차주 또는 대상회사에 대하여 회생절차 개시 신청이 있는 경우"],"heads":[0,3]},{"page":8,"lines":["제15조(대리금융기관)","유진투자증권은 대주단을 위한 대리금융기관으로서 서류 수령·전달, 원리금 수령·배분 및 대주단 의사 취합 업무를 수행한다.","대리금융기관은 차주의 의무 이행 여부를 보증하지 아니한다.","제16조(비밀유지)","각 당사자는 본 약정 및 거래 관련 정보를 제3자에게 누설하여서는 아니 된다. 다만 법령상 공개 의무가 있는 경우는 예외로 한다.","서명","차주 A홀딩스 주식회사 (가상) / 대리금융기관 유진투자증권 / 대주 별표 2 기재 각 대주 (서명 생략, 가상)"],"heads":[0,3,5]},{"page":9,"lines":["[별표 1] Tranche A 분할상환표","상환일이 영업일이 아닌 경우 제5조 제3항에 따라 다음 영업일에 상환한다. 금액 단위: 억원","회차 상환예정일 상환금액 상환 후 잔액","1회차 2027.05.20 15억원 285억원","2회차 2027.11.20 15억원 270억원","3회차 2028.05.20 25억원 245억원","4회차 2028.11.20 25억원 220억원","5회차 2029.05.20 30억원 190억원","6회차 2029.11.20 30억원 160억원","7회차 2030.05.20 35억원 125억원","8회차 2030.11.20 35억원 90억원","9회차 2031.05.20 45억원 45억원","10회차 2031.11.20 45억원 0억원","합계 300억원"],"heads":[0]},{"page":10,"lines":["[별표 2] 대주단 참여금액","금액 단위: 억원 (Tranche A·B 비례 참여)","대주 참여금액 Tranche A Tranche B","가상은행 120억원 72억원 48억원","가상캐피탈 100억원 60억원 40억원","가상생명 80억원 48억원 32억원","가상저축은행 60억원 36억원 24억원","가상증권 80억원 48억원 32억원","가상공제회 60억원 36억원 24억원","합계 500억원 300억원 200억원"],"heads":[0]}]},"02_티저.pdf":{"name":"02_티저.pdf","size":83637,"kind":"pdf","pages":[{"page":1,"lines":["Project B 인수금융 투자 제안 (티저)","익명 딜 개요 · 주선 유진투자증권 · 본 자료는 가상 시연용입니다.","딜 개요","국내 중견 제조사(대상회사)의 경영권 지분 인수를 위한 인수금융입니다. 차주는 스폰서가 설립한 SPC입니다.","핵심 조건 요약","항목 내용","대출금액 총 500억원 (Tranche A 300억원 / Tranche B 200억원)","만기 인출일로부터 5년","금리 연 6.0~6.5% 범위 고정금리 (확정 금리는 약정서 기준)","상환방식 Tranche A  일할 계산한다."}]},"answer_1ba97d24":{"answer":"기한이익상실(EOD) 사유는 원리금 지급기일로부터 5영업일 이내 미지급, 재무약정 위반 후 30일 내 미치유, 차주·대상회사의 회생절차 개시 신청 등입니다. 실제 선언은 대주단 결의에 따릅니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제14조(기한이익상실)","page":7,"quote":"1. 원리금 지급기일로부터 5영업일 이내에 원리금을 지급하지 아니한 경우"},{"doc":"01_대출약정서.pdf","article":"제14조(기한이익상실)","page":7,"quote":"2. 제12조의 재무약정을 위반하고 30일 이내에 치유하지 아니한 경우"}]},"answer_1cff4b2c":{"answer":"현재 테이블에 올라온 자료에서는 찾을 수 없습니다.","found":false,"sources":[],"note":"이 자리의 권한으로 볼 수 있는 자료에는 근거가 없습니다."},"answer_22e1e918":{"answer":"대리금융기관은 유진투자증권이며 서류 수령·전달, 원리금 수령·배분, 대주단 의사 취합 업무를 수행합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제15조(대리금융기관)","page":8,"quote":"유진투자증권은 대주단을 위한 대리금융기관으로서 서류 수령·전달, 원리금 수령·배분 및 대주단 의사 취합 업무를 수행한다."}]},"answer_235281c5":{"answer":"대리금융기관은 유진투자증권이며 서류 수령·전달, 원리금 수령·배분, 대주단 의사 취합 업무를 수행합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제15조(대리금융기관)","page":8,"quote":"유진투자증권은 대주단을 위한 대리금융기관으로서 서류 수령·전달, 원리금 수령·배분 및 대주단 의사 취합 업무를 수행한다."}]},"answer_23e3d75a":{"answer":"차입금상환검토보고서 기준 2027년 DSCR(원리금상환비율)은 1.33배입니다. 보고서의 참고값이며 판단이 아닙니다. 참고로 이 보고서는 2회차 상환금액을 20억원으로 적어 약정서 별표 1(15억원)과 다릅니다.","found":true,"sources":[{"doc":"04_차입금상환검토보고서.pdf","article":"3. DSCR(원리금상환비율)","page":2,"quote":"2027 1.33배"}]},"answer_2849c66b":{"answer":"PC-01 인수대금 지급 확인서는 인출일(2026.11.20)로부터 5영업일 이내, 즉 2026.11.27(금)까지 제출해야 합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제11조(후행조건)","page":6,"quote":"PC-01 인수대금 지급 확인서: 인출일로부터 5영업일 이내 대상회사 주식 인수대금 지급 확인서 제출"}]},"answer_2f723145":{"answer":"조기상환수수료는 최초 인출일로부터 1년 이내 조기상환 시 상환금액의 1.0%이며, 1년이 지나면 수수료가 없습니다. 조기상환하려면 10영업일 전에 서면으로 통지해야 합니다. 티저의 '없음' 기재는 약정서와 달라 host 확인 중입니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제9조(조기상환)","page":5,"quote":"② 최초 인출일로부터 1년 이내 조기상환하는 경우 상환금액의 1.0%를 조기상환수수료로 지급한다. 1년 경과 후에는 수수료가 없다."},{"doc":"01_대출약정서.pdf","article":"제9조(조기상환)","page":5,"quote":"① 차주는 10영업일 전 서면 통지로 대출금의 전부 또는 일부를 조기상환할 수 있다."}]},"answer_303594d4":{"answ ."}]},"answer_457dcd51":{"answer":"첫 이자지급일은 2026.12.21(월)입니다. 약정상 이자는 인출일이 속한 달의 다음 달부터 매월 20일에 지급하는데, 2026.12.20이 일요일이라 다음 영업일로 조정됐습니다. 이후에도 20일이 비영업일이면 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제7조(이자의지급)","page":4,"quote":"차주는 최초 인출일이 속한 달의 다음 달부터 매월 20일에 이자를 지급한다."},{"doc":"01_대출약정서.pdf","article":"제8조(영업일조정)","page":4,"quote":"이자지급일이 영업일이 아닌 경우 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산한다."}]},"answer_48a26af4":{"answer":"레버리지비율(순차입금/EBITDA)은 연결재무제표 기준 5.0배 이하로 유지해야 합니다. 위반 여부 판정은 host 검토 사항입니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제12조(재무약정)","page":6,"quote":"1. 레버리지비율(순차입금/EBITDA): 5.0배 이하"}]},"answer_4aa4e798":{"answer":"이자지급일이 영업일이 아니면 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산합니다. 예를 들어 2026.12.20(일)분은 2026.12.21(월)에 지급합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제8조(영업일조정)","page":4,"quote":"이자지급일이 영업일이 아닌 경우 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산한다."}]},"answer_4bc7361f":{"answer":"대리금융기관은 유진투자증권이며 서류 수령·전달, 원리금 수령·배분, 대주단 의사 취합 업무를 수행합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제15조(대리금융기관)","page":8,"quote":"유진투자증권은 대주단을 위한 대리금융기관으로서 서류 수령·전달, 원리금 수령·배분 및 대주단 의사 취합 업무를 수행한다."}]},"answer_4c6b0932":{"answer":"인출선행조건 서류는 CP-01 이사회 의사록(차입 및 담보 제공 승인), CP-02 법인등기사항전부증명서, CP-03 주식근질권설정계약서, CP-04 법률의견서, CP-05 인감증명서입니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제10조(인출선행조건)","page":5,"quote":"CP-01 이사회 의사록: 본 약정에 따른 차입 및 담보 제공을 승인하는 차주 이사회 결의 의사록 사본"},{"doc":"01_대출약정서.pdf","article":"제10조(인출선행조건)","page":5,"quote":"CP-05 인감증명서: 차주의 법인인감증명서 및 사용인감계"}]},"answer_4cd4bcbb":{"answer":"대출 만기일은 최초 인출일로부터 5년이 되는 2031.11.20(목)입니다. 그날이 영업일이 아니면 다음 영업일로 합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제4조(만기)","page":3,"quote":"대출의 만기일은 최초 인출일로부터 5년이 되는 날로 하며, 그 날이 영업일이 아닌 경우 다음 영업일로 한다."}]},"answer_58aa0d60":{"answer":"약정서 별표 1 기준 Tranche A 2회차 상환금액은 15억원이며, 예정일 2027.11.20이 토요일이라 2027.11.22(월)에 상환합니다. 상환검토보고서는 20억원으로 적고 있어 약정서와 다릅니다.","found":true,"sources":[{"do 로 하고, 연 365일 기준 일할 계산한다."}]},"answer_7abc8e86":{"answer":"레버리지비율(순차입금/EBITDA)은 연결재무제표 기준 5.0배 이하로 유지해야 합니다. 위반 여부 판정은 host 검토 사항입니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제12조(재무약정)","page":6,"quote":"1. 레버리지비율(순차입금/EBITDA): 5.0배 이하"}]},"answer_7af01060":{"answer":"PC-02 질권설정 승낙서와 확정일자 부여 증빙은 인출일로부터 14일 이내, 즉 2026.12.04(금)까지 제출해야 합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제11조(후행조건)","page":6,"quote":"PC-02 담보 관련 확인자료: 인출일로부터 14일 이내 질권설정 승낙서 및 확정일자 부여 증빙 제출"}]},"answer_7b10fec7":{"answer":"첫 이자지급일은 2026.12.21(월)입니다. 약정상 이자는 인출일이 속한 달의 다음 달부터 매월 20일에 지급하는데, 2026.12.20이 일요일이라 다음 영업일로 조정됐습니다. 이후에도 20일이 비영업일이면 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제7조(이자의지급)","page":4,"quote":"차주는 최초 인출일이 속한 달의 다음 달부터 매월 20일에 이자를 지급한다."},{"doc":"01_대출약정서.pdf","article":"제8조(영업일조정)","page":4,"quote":"이자지급일이 영업일이 아닌 경우 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산한다."}]},"answer_7b3b1e30":{"answer":"첫 이자지급일은 2026.12.21(월)입니다. 약정상 이자는 인출일이 속한 달의 다음 달부터 매월 20일에 지급하는데, 2026.12.20이 일요일이라 다음 영업일로 조정됐습니다. 이후에도 20일이 비영업일이면 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제7조(이자의지급)","page":4,"quote":"차주는 최초 인출일이 속한 달의 다음 달부터 매월 20일에 이자를 지급한다."},{"doc":"01_대출약정서.pdf","article":"제8조(영업일조정)","page":4,"quote":"이자지급일이 영업일이 아닌 경우 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산한다."}]},"answer_7d58ecdb":{"answer":"Tranche A는 약정서 제5조에 따라 별표 1 분할상환표대로 10회 분할상환합니다. 1회차는 2027.05.20 15억원입니다. Q&A 모음집 17행의 '만기일시' 답변은 약정서와 달라 host 확인이 필요합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제5조(상환)","page":3,"quote":"① Tranche A 대출은 별표 1 분할상환표에 따라 분할상환한다."},{"doc":"01_대출약정서.pdf","article":"별표 1(Tranche A 분할상환표)","page":9,"quote":"1회차 2027.05.20 15억원 285억원"}]},"answer_7ec78668":{"answer":"대리금융기관은 유진투자증권이며 서류 수령·전달, 원리금 수령·배분, 대주단 의사 취합 업무를 수행합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제15조(대리금융기관)","page":8,"quote":"유진투자증권은 대주단을 위한 대리금융기관으로서 서류 수령·전달, 원리금 수령·배분 및 대주단 의사 취합 업무를 수행한다."}]},"answer_816b5ca1":{"answer":"인출선행조건 서류는 CP-01 이사회 의사록(차입 및 담보 제공 승인), CP-02 법인등기사항전부증명서, CP-03 주식근질권설정계약서, CP-04 법률의견서, CP-05 인감증명서입니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제10조(인출선행조건)","page":5,"quote":"CP-01 이사회 의사록: 본 약정에 따른 차입 및 담보 제공을 승인하는 차주 이사회 결의 의사록 사본"},{"doc":"01_대출약정서.pdf","article":"제10조(인출선행조건)","page":5,"quote":"CP-05 인감증명서: 차주의 법인인감증명서 및 사용인감계"}]},"answer_8722dc81":{"answer":"PC-01 인수대금 지급 확인서는 인출일(2026.11.20)로부터 5영업일 이내, 즉 2026.11.27(금)까지 제출해야 합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제11조(후행조건)","page":6,"quote":"PC-01 인수대금 지급 확인서: 인출일로부터 5영업일 이내 대상회사 주식 인수대금 지급 확인서 제출"}]},"answer_8858fe2c":{"answer":"Tranche A는 약정서 제5조에 따라 별표 1 분할상환표대로 10회 분할상환합니다. 1회차는 2027.05.20 15억원입니다. Q&A 모음집 17행의 '만기일시' 답변은 약정서와 달라 host 확인이 필요합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제5조(상환)","page":3,"quote":"① Tranche A 대출은 별표 1 분할상환표에 따라 분할상환한다."},{"doc":"01_대출약정서.pdf","article":"별표 1(Tranche A 분할상환표)","page":9,"quote":"1회차 2027.05.20 15억원 285억원"}]},"answer_8d3a9836":{"answer":"기한이익상실(EOD) 사유는 원리금 지급기일로부터 5영업일 이내 미지급, 재무약정 위반 후 30일 내 미치유, 차주·대상회사의 회생절차 개시 신청 등입니다. 실제 선언은 대주단 결의에 따릅니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제14조(기한이익상실)","page":7,"quote":"1. 원리금 지급기일로부터 5영업일 이내에 원리금을 지급하지 아니한 경우"},{"doc":"01_대출약정서.pdf","article":"제14조(기한이익상실)","page":7,"quote":"2. 제12조의 재무약정을 위반하고 30일 이내에 치유하지 아니한 경우"}]},"answer_8f18edbe":{"answer":"Tranche B 200억원은 만기일에 전액 만기일시상환합니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제5조(상환)","page":3,"quote":"② Tranche B 대출은 만기일에 전액 만기일시상환한다."}]},"answer_908f8166":{"answer":"분기 재무제표와 재무약정 준수확인서는 각 회계분기 종료일로부터 45일 이내에 제출합니다. 마지막 날이 비영업일이면 다음 영업일까지이며, 2026년 4분기분은 2027.02.15(월)까지입니다.","found":true,"sources":[{"doc":"01_대출약정서.pdf","article":"제13조(정보제공의무)","page":7,"quote":"차주는 각 회계분기 종료일로부터 45일 이내에 분기 재무제표 및 재무약정 준수확인서를 제출하여야 한다."},{"doc":"01_대출약정서.pdf","article":"제13조(정보제공의무)","page":7,"quote":"제출기한의 마지막 날이 영업일이 아닌 경우 그 다음 영업일까지 제출한다."}]},"answe     r = find(lines, /^상환방식\s+(.+)$/);

      ex.repayment = {};
      ["A", "B"].forEach((k) => { const m = r.m[1].match(new RegExp(`Tranche\\s*${k}\\s*(분할상환|만기일시)`)); if (m) ex.repayment[k] = { method: m[1] === "분할상환" ? "분할상환" : "만기일시상환", src: S(r) }; });
    }
    r = find(lines, /^조기상환수수료\s+(.+)$/);
    if (r) { const p = r.m[1].match(/([\d.]+)\s*%/); ex.prepayFee = { text: r.m[1].trim(), pct: p ? Number(p[1]) : 0, src: S(r) }; }
    ex.covenants = [];
    lines.forEach((l) => {
      const re = /(레버리지비율|이자보상비율)\s*([\d.]+)\s*배\s*(이하|이상)/g; let m;
      while ((m = re.exec(l.line))) ex.covenants.push({ name: m[1], limit: Number(m[2]), dir: m[3], src: { doc: name, article: l.article, page: l.page, quote: l.line } });
    });
    return ex;
  }
  if (doc.type === "차입금상환검토보고서") {
    const ex = { schedule: [], dscr: [], fcf: [] };
    lines.forEach((l) => {
      const src = { doc: name, article: l.article, page: l.page, quote: l.line };
      let m = l.line.match(/^(\d+)\s*회차\s+(\d{4}\.\d{2}\.\d{2})\s+([\d,]+)\s*억원$/);
      if (m) ex.schedule.push({ round: Number(m[1]), date: dotDate(m[2]), amount: num(m[3]), src });
      m = l.line.match(/^(20\d\d)\s+([\d.]+)\s*배$/);
      if (m) ex.dscr.push({ year: Number(m[1]), value: Number(m[2]), src });
      m = l.line.match(/^(20\d\d)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)$/);
      if (m) ex.fcf.push({ year: Number(m[1]), fcf: Number(m[2]), interest: Number(m[3]), principal: Number(m[4]), debtService: Number(m[5]), src });
    });
    const op = lines.findIndex((l) => /검토의견/.test(l.line));
    if (op >= 0 && lines[op + 1]) ex.opinion = { text: lines[op + 1].line, src: { doc: name, article: lines[op + 1].article, page: lines[op + 1].page, quote: lines[op + 1].line } };
    return ex;
  }
  return {};
}

/* ───────────── Q&A·질문로그·명단 (행 그대로 로드, LLM 불필요) ───────────── */
const QNA_COLS = ["No", "접수일", "질문기관", "질문자역할", "카테고리", "질문", "답변", "답변자", "근거문서", "근거조항·페이지", "상태", "공개범위"];

function qnaRows(doc) {
  const sh = (doc.sheets || []).find((s) => /qna/i.test(s.name)) || (doc.sheets || [])[0];
  if (!sh) return [];
  const head = sh.rows[0].map(String);
  const col = (n) => head.indexOf(n);
  return sh.rows.slice(1).map((r, i) => ({
    row: i + 2, no: r[col("No")], date: r[col("접수일")], org: r[col("질문기관")], role: r[col("질문자역할")], category: r[col("카테고리")],
    q: r[col("질문")], a: r[col("답변")], by: r[col("답변자")], srcDoc: r[col("근거문서")], srcRef: r[col("근거조항·페이지")],
    status: r[col("상태")] || (r[col("답변")] ? "답변완료" : "미답변"), scope: r[col("공개범위")] || "전체",
  })).filter((x) => x.q);
}
function logRows(doc) {
  const sh = (doc.sheets || [])[0];
  if (!sh) return [];
  const head = sh.rows[0].map(String);
  const c = (n) => head.indexOf(n);
  return sh.rows.slice(1).map((r, i) => ({ id: "Q" + pad(i + 2), row: i + 2, org: r[c("기관")], at: r[c("수신시각")], channel: r[c("채널")], text: r[c("질문원문")] })).filter((x) => x.text);
}
function rosterRows(doc) {
  const sh = (doc.sheets || [])[0];
  if (!sh) return [];
  const head = sh.rows[0].map(String);
  const c = (n) => head.indexOf(n);
  return sh.rows.slice(1).map((r) => ({ seat: r[c("자리(역할)")], org: r[c("기관명")], person: r[c("담당자")], title: r[c("직함")], phone: r[c("연락처")], email: r[c("이메일")], grade: r[c("권한등급")] })).filter((x) => x.seat);
}

/* ───────────── CP·PC 체크리스트와 서류 대조 ───────────── */
const ELEMENT_RULES = [
  { when: /차입/, label: "차입 승인", test: /차입[^.\n]{0,30}(승인|가결|의결)/ },
  { when: /담보\s*제공/, label: "담보 제공 승인", test: /담보\s*제공[^.\n]{0,30}(승인|가결|의결)/ },
  { when: /질권설정\s*승낙/, label: "질권설정 승낙", test: /질권[^.\n]{0,30}승낙/ },
  { when: /확정일자/, label: "확정일자 부여", test: /확정일자[^.\n]{0,10}(부여|\d{4}년)/ },
  { when: /인수대금/, label: "인수대금 지급 사실", test: /인수대금[^.\n]{0,30}지급/ },
];
const requiredElements = (text) => ELEMENT_RULES.filter((e) => e.when.test(text)).map((e) => e.label);

function reviewDocument(cond, doc) {
  const sentences = [];
  (doc.pages || []).forEach(({ page, lines }) => lines.forEach((s) => sentences.push({ page, s })));
  const checks = requiredElements(cond.title + " " + cond.desc).map((label) => {
    const rule = ELEMENT_RULES.find((e) => e.label === label);
    const hit = sentences.find((x) => rule.test.test(x.s));
    return { label, ok: !!hit, quote: hit ? hit.s : null, page: hit ? hit.page : null };
  });
  const missing = checks.filter((c) => !c.ok);
  const status = missing.length ? "보완 필요" : "적합 후보";
  const guide = missing.length
    ? `${missing.map((m) => m.label).join(", ")}에 관한 결의 문장이 확인되지 않습니다. 해당 내용이 포함된 서류를 보완 제출해 주세요.`
    : "요구 요소와 문장이 모두 대조됐습니다. 확정은 host 담당자가 합니다.";
  return { status, checks, guide, docName: doc.name };
}

function conditionForDoc(conditions, docType) {
  if (docType === "이사회의사록") return conditions.find((c) => /이사회/.test(c.title));
  return null;
}

/* ───────────── 일정 (영업일 조정 포함) ───────────── */
function buildEvents(state) {
  const c = contractEx(state);
  if (!c || !c.drawdown) return [];
  const report = reportEx(state);
  const ev = [];
  const cite = (s) => (s ? `${s.article || "본문"} · p.${s.page}` : "");
  const push = (e) => ev.push({ raw: e.date, adjNote: "", ...e });
  const adjNote = (raw, date) => (raw !== date ? `${fmtW(raw)} ${nonBusinessReason(raw) || ""} → ${fmtW(date)}` : "");
  const drawdown = c.drawdown.date;
  if (c.signing) push({ key: "signing", type: "약정", title: "대출약정 체결", date: c.signing.date, basis: cite(c.signing.src), owner: "host", evidence: "서명본", criteria: "서명본 등록" });
  push({ key: "drawdown", type: "인출", title: "대출 인출", date: drawdown, basis: cite(c.drawdown.src), owner: "host", evidence: "집행 증빙", criteria: "인출 집행 확인" });
  const matRaw = c.maturity ? addYears(drawdown, c.maturity.years) : null;
  const maturity = matRaw ? adjust(matRaw, c.maturity.adj) : null;
  if (c.interest && matRaw) {
    const d = toDate(drawdown);
    let y = d.getUTCFullYear(), m = d.getUTCMonth() + 2;
    for (let i = 0; i < 80; i++) {
      if (m > 12) { m -= 12; y++; }
      const raw = ymd(y, m, Math.min(c.interest.day, daysInMonth(y, m)));
      if (raw > matRaw) break;
      const date = adjust(raw, c.interest.adj);
      push({ key: `int-${y}-${pad(m)}`, type: "이자", title: `${y}년 ${m}월 이자 지급일`, date, raw, adjNote: adjNote(raw, date), basis: `${cite(c.interest.src)} · 매월 ${c.interest.day}일${c.interest.adj === "following" ? ", 비영업일이면 다음 영업일" : ""}`, owner: "borrower", evidence: "입금증빙", criteria: "대리금융기관 입금 확인" });
      m++;
    }
  }
  (c.schedule || []).forEach((s) => {
    const date = nextBusinessDay(s.date);
    const yr = Number(s.date.slice(0, 4));
    const dscr = report && (report.dscr || []).find((x) => x.year === yr);
    push({ key: `repay-${s.round}`, type: "상환", title: `Tranche A ${s.round}회차 상환 (${s.amount}억원)`, date, raw: s.date, adjNote: adjNote(s.date, date), basis: `${cite(s.src)} · 상환일이 비영업일이면 다음 영업일(제5조)`, owner: "borrower", evidence: "입금증빙", criteria: "원금 입금 확인", amount: s.amount, dscrRef: dscr ? { year: yr, value: dscr.value, src: dscr.src } : null });
  });
  (c.conditions || []).filter((x) => x.kind === "PC" && x.deadline).forEach((x) => {
    const date = x.deadline.unit === "영업일" ? addBusinessDays(drawdown, x.deadline.n) : addDays(drawdown, x.deadline.n);
    const st = (state.conditions || []).find((k) => k.id === x.id);
    push({ key: x.id, type: "후행조건", title: `${x.id} ${x.title} 제출기한`, date, basis: `${cite(x.src)} · 인출일 + ${x.deadline.n}${x.deadline.unit}`, owner: "borrower", evidence: x.title, criteria: "증빙 접수 후 host 확정", condId: x.id, done: st && st.status === "확정 완료" });
  });
  if (matRaw) {
    const d = toDate(drawdown);
    let y = d.getUTCFullYear(), q = Math.floor(d.getUTCMonth() / 3) + 1;
    for (let i = 0; i < 24; i++) {
      const qe = ymd(y, q * 3 + 1, 0);
      if (qe > maturity) break;
      if (qe > drawdown) {
        if (c.firstTest && qe >= c.firstTest.date) push({ key: `cov-${y}Q${q}`, type: "재무약정", title: `${y}년 ${q}분기 재무약정 측정기준일`, date: qe, basis: `${cite(c.firstTest.src)} · 매 회계분기 종료일`, owner: "host", evidence: "준수확인서", criteria: "산정 결과를 host가 검토 (AI 판정 아님)" });
        if (c.reporting) {
          const raw = addDays(qe, c.reporting.days), date = adjust(raw, c.reporting.adj);
          push({ key: `rep-${y}Q${q}`, type: "정보제공", title: `${y}년 ${q}분기 재무제표·준수확인서 제출기한`, date, raw, adjNote: adjNote(raw, date), basis: `${cite(c.reporting.src)} · 분기말 + ${c.reporting.days}일${c.reporting.adj === "following" ? ", 비영업일이면 다음 영업일" : ""}`, owner: "borrower", evidence: "분기 재무제표, 준수확인서", criteria: "접수 후 host 검토" });
        }
      }
      q++; if (q > 4) { q = 1; y++; }
    }
    push({ key: "maturity", type: "만기", title: "대출 만기일 (Tranche B 만기일시상환)", date: maturity, raw: matRaw, adjNote: adjNote(matRaw, maturity), basis: `${cite(c.maturity.src)} · 인출일 + ${c.maturity.years}년`, owner: "borrower", evidence: "입금증빙", criteria: "원리금 상환 확인" });
  }
  return ev.sort((a, b) => a.date.localeCompare(b.date) || a.type.localeCompare(b.type));
}

const contractEx = (state) => { const d = state.docs.find((x) => x.type === "대출약정서" && x.extracted); return d ? d.extracted : null; };
const reportEx = (state) => { const d = state.docs.find((x) => x.type === "차입금상환검토보고서" && x.extracted); return d ? d.extracted : null; };
const teaserEx = (state) => { const d = state.docs.find((x) => (x.type === "티저" || x.type === "텀시트") && x.extracted); return d ? d : null; };

// 사후관리 알림: 기준일로부터 14일 내 일정, 기한 경과, 보완 필요 서류, 미회신 요청
function alertsFor(state, seatId) {
  const role = seatRole(state.seats, seatId);
  const demo = state.settings.demoDate;
  const out = [];
  const mine = (owner) => role === "host" || owner === role || (role === "sponsor" && owner === "borrower");
  buildEvents(state).forEach((e) => {
    if (e.done || !mine(e.owner)) return;
    const dd = diffDays(demo, e.date);
    if (dd >= 0 && dd <= 14) out.push({ level: dd <= 3 ? "warn" : "info", kind: "일정", text: `${e.title}`, due: e.date, dday: dd, key: e.key });
    else if (dd < 0 && dd >= -7 && (e.type === "후행조건")) out.push({ level: "danger", kind: "기한 경과", text: e.title, due: e.date, dday: dd, key: e.key });
  });
  (state.conditions || []).forEach((c) => {
    if (c.status === "보완 필요" && (role === "host" || role === "borrower" || role === "counsel")) out.push({ level: "warn", kind: "보완 필요", text: `${c.id} ${c.title}`, due: null, key: c.id });
  });
  (state.requests || []).forEach((r) => {
    if (r.status !== "회신완료" && (r.to === seatId || role === "host")) out.push({ level: r.to === seatId ? "warn" : "info", kind: "미회신 요청", text: r.title, due: null, key: r.id, seat: r.to });
  });
  return out.sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
}

/* ───────────── 불일치 탐지 (규칙 코드만 비교, LLM은 추출만) ───────────── */
function findDiscrepancies(state) {
  const c = contractEx(state);
  if (!c) return [];
  const cdoc = state.docs.find((x) => x.type === "대출약정서");
  const items = [];
  const add = (field, a, b) => items.push({ id: "D" + (items.length + 1), field, a, b });
  const t = teaserEx(state);
  if (t) {
    const te = t.extracted;
    if (c.amount && te.amount && c.amount.total !== te.amount.total) add("대출금액", { doc: cdoc.name, value: `${c.amount.total}억원`, src: c.amount.src }, { doc: t.name, value: `${te.amount.total}억원`, src: te.amount.src });
    if (c.maturity && te.maturity && c.maturity.years !== te.maturity.years) add("만기", { doc: cdoc.name, value: `${c.maturity.years}년`, src: c.maturity.src }, { doc: t.name, value: `${te.maturity.years}년`, src: te.maturity.src });
    if (c.rate && te.rate && (c.rate.value < te.rate.min || c.rate.value > te.rate.max)) add("금리", { doc: cdoc.name, value: `연 ${c.rate.value}%`, src: c.rate.src }, { doc: t.name, value: `연 ${te.rate.min}~${te.rate.max}%`, src: te.rate.src });
    if (c.prepayFee && te.prepayFee && c.prepayFee.pct !== te.prepayFee.pct) add("조기상환수수료", { doc: cdoc.name, value: c.prepayFee.text, src: c.prepayFee.src }, { doc: t.name, value: te.prepayFee.text, src: te.prepayFee.src });
    ["A", "B"].forEach((k) => {
      const a = (c.repayment || {})[k], b = (te.repayment || {})[k];
      if (a && b && a.method !== b.method) add(`Tranche ${k} 상환방식`, { doc: cdoc.name, value: a.method, src: a.src }, { doc: t.name, value: b.method, src: b.src });
    });
    (c.covenants || []).forEach((cv) => {
      const o = (te.covenants || []).find((x) => x.name === cv.name);
      if (o && (o.limit !== cv.limit || o.dir !== cv.dir)) add(cv.name, { doc: cdoc.name, value: `${cv.limit}배 ${cv.dir}`, src: cv.src }, { doc: t.name, value: `${o.limit}배 ${o.dir}`, src: o.src });
    });
  }
  // Q&A 답변 ↔ 약정서: 상환방식·조기상환수수료·금리를 문장에서 규칙으로 판독
  const qdoc = state.docs.find((x) => x.type === "Q&A모음집");
  if (qdoc) {
    qnaRows(qdoc).filter((r) => r.a).forEach((r) => {
      const qsrc = { doc: qdoc.name, row: r.row, quote: r.a };
      ["A", "B"].forEach((k) => {
        if (!new RegExp(`Tranche\\s*${k}`).test(r.q + r.a) || !/상환/.test(r.q)) return;
        const said = /만기일시/.test(r.a) ? "만기일시상환" : /분할/.test(r.a) ? "분할상환" : null;
        const a = (c.repayment || {})[k];
        if (said && a && said !== a.method) add(`Tranche ${k} 상환방식`, { doc: cdoc.name, value: a.method, src: a.src }, { doc: `${qdoc.name} ${r.row}행`, value: said, src: qsrc });
      });
      if (/조기상환|중도상환/.test(r.q) && c.prepayFee) {
        const p = r.a.match(/([\d.]+)\s*%/);
        const pct = p ? Number(p[1]) : /없/.test(r.a) ? 0 : null;
        if (pct !== null && pct !== c.prepayFee.pct) add("조기상환수수료", { doc: cdoc.name, value: c.prepayFee.text, src: c.prepayFee.src }, { doc: `${qdoc.name} ${r.row}행`, value: r.a, src: qsrc });
      }
      if (/금리|이자율/.test(r.q) && c.rate) {
        const p = r.a.match(/([\d.]+)\s*%/);
        if (p && Number(p[1]) !== c.rate.value) add("금리", { doc: cdoc.name, value: `연 ${c.rate.value}%`, src: c.rate.src }, { doc: `${qdoc.name} ${r.row}행`, value: r.a, src: qsrc });
      }
    });
  }
  const rep = reportEx(state);
  const rdoc = state.docs.find((x) => x.type === "차입금상환검토보고서");
  if (rep && c.schedule) {
    c.schedule.forEach((s) => {
      const o = (rep.schedule || []).find((x) => x.round === s.round);
      if (!o) return;
      if (o.amount !== s.amount) add(`Tranche A ${s.round}회차 상환금액`, { doc: cdoc.name, value: `${s.amount}억원`, src: s.src }, { doc: rdoc.name, value: `${o.amount}억원`, src: o.src });
      if (o.date !== s.date) add(`Tranche A ${s.round}회차 상환일`, { doc: cdoc.name, value: fmt(s.date), src: s.src }, { doc: rdoc.name, value: fmt(o.date), src: o.src });
    });
  }
  return items;
}

/* ───────────── 검색: 권한 안 문서만 청크로 ───────────── */
function buildChunks(state, seatId) {
  const role = seatRole(state.seats, seatId);
  const chunks = [];
  state.docs.forEach((d) => {
    const code = (DOC_TYPES.find((t) => t.type === d.type) || {}).code || "X";
    if (!ANSWER_CODES.includes(code) || !canSee(state.matrix, role, d.type)) return;
    if (d.kind === "xlsx") {
      if (d.type !== "Q&A모음집") return;
      const publicOnly = state.matrix[d.type][role] === "public";
      qnaRows(d).concat(state.qnaAdded || []).forEach((r) => {
        if (!r.a || (publicOnly && r.scope !== "전체")) return;
        chunks.push({ id: `${d.id}#r${r.row}`, docId: d.id, doc: d.name, type: d.type, row: r.row, article: `${r.row}행`, text: `질문: ${r.q}\n답변: ${r.a}`, weight: 1.35 });
      });
      return;
    }
    const groups = new Map();
    docLines(d).forEach((l) => {
      const k = `${l.page}|${l.article || ""}`;
      if (!groups.has(k)) groups.set(k, { page: l.page, article: l.article, lines: [] });
      groups.get(k).lines.push(l.line);
    });
    groups.forEach((g, k) => chunks.push({ id: `${d.id}#${k}`, docId: d.id, doc: d.name, type: d.type, page: g.page, article: g.article, text: g.lines.join("\n"), weight: d.type === "대출약정서" ? 1.1 : 1 }));
  });
  return chunks;
}

const STOP = new Set(["나요", "인가", "있나", "어떻", "떻게", "되나", "언제", "얼마", "무엇", "엇인", "인가요", "까요", "주세", "세요", "알려", "려주", "부탁", "탁드", "드립", "립니", "니다", "습니", "는지", "은지", "하나", "궁금", "금합", "확인", "가요", "는데", "건가"]);
const bigrams = (s) => { const t = squash(s).replace(/[?.!,:;/~%]/g, ""); const out = new Set(); for (let i = 0; i < t.length - 1; i++) { const b = t.slice(i, i + 2); if (!STOP.has(b)) out.add(b); } return out; };
function rank(chunks, q, k = 5) {
  const Q = bigrams(q);
  if (!Q.size) return [];
  return chunks.map((c) => {
    const C = bigrams(c.text);
    let n = 0; Q.forEach((b) => { if (C.has(b)) n++; });
    return { ...c, score: (n / Q.size) * c.weight };
  }).filter((c) => c.score > 0.12).sort((a, b) => b.score - a.score).slice(0, k);
}

/* ───────────── 근거 기반 답변 (규칙 엔진판) ───────────── */
const NOT_FOUND = "현재 테이블에 올라온 자료에서는 찾을 수 없습니다.";

// AI가 단정하지 않는 질문 (CLAUDE.md 5장)
function detectDecision(q) {
  if (/(지급|입금|납입)(했|됐|되었|완료|여부|확인)|들어왔/.test(q)) return { type: "payment", routeTo: "host", note: "지급 사실은 입금증빙이 있어야 확인할 수 있어 AI가 단정하지 않습니다. 확인 불가 — host 확인이 필요합니다." };
  if (/유효|적법|대항요건|대항력|법적|완결|효력/.test(q)) return { type: "legal", routeTo: "counsel", note: "법적 완결성·효력 판단은 AI가 하지 않습니다. 법무법인 자리로 넘깁니다." };
  if (/(재무약정|약정).*(위반|준수\s*여부|충족\s*여부)|위반(인가|했|여부)/.test(q)) return { type: "covenant", routeTo: "host", note: "재무약정 위반 여부는 미확정입니다. host 검토가 필요합니다." };
  if (/어느\s*(쪽|게|것)|뭐가\s*맞|어떤\s*게\s*맞/.test(q)) return { type: "conflict", routeTo: "host", note: "문서 간 값이 다를 때 어느 쪽이 맞는지는 AI가 판단하지 않습니다. host와 법무법인 확인이 필요합니다." };
  return null;
}

function categoryOf(q) {
  if (/법률|대항|질권\s*실행|유효|적법|효력|법적/.test(q)) return "법률";
  if (/출자|증자|자금\s*지원|실적|경영|배당|매출|EBITDA/i.test(q)) return "실적·경영";
  if (/서류|제출|증빙|의사록|등기|인감/.test(q)) return "서류";
  return "조건·구조";
}
const ROUTE = { "법률": "counsel", "실적·경영": "sponsor", "서류": "borrower", "조건·구조": "host", "일정": "host", "재무약정": "host" };

function factSrc(src) { return src ? [{ doc: src.doc, article: src.article, page: src.page, quote: src.quote }] : []; }

function answerRule(state, seatId, question) {
  const q = normQ(question);
  const chunks = buildChunks(state, seatId);
  const allowed = new Set(chunks.map((c) => c.type));
  const c = allowed.has("대출약정서") ? contractEx(state) : null;
  const rep = allowed.has("차입금상환검토보고서") ? reportEx(state) : null;
  const decision = detectDecision(q);
  const events = c ? buildEvents(state) : [];
  const ev = (key) => events.find((e) => e.key === key);
  const say = (text, srcs) => ({ answer: text, found: true, sources: srcs.flat().filter(Boolean), decision });
  let r = null;
  if (c) {
    if (/첫\s*이자|다음\s*이자|이자[^.]{0,6}(언제|지급일|날짜|주기)/.test(q) && c.interest) {
      const first = events.find((e) => e.type === "이자" && (!/다음/.test(q) || e.date >= state.settings.demoDate));
      if (first) r = say(`${/다음/.test(q) ? "다음" : "첫"} 이자지급일은 ${fmtW(first.date)}입니다. 약정상 매월 ${c.interest.day}일에 지급하며${first.adjNote ? `, ${fmt(first.raw)}이 ${nonBusinessReason(first.raw)}이라 다음 영업일로 조정됐습니다` : ""}. 이자지급일이 영업일이 아니면 다음 영업일에 지급합니다.`, [factSrc(c.interest.src), factSrc(c.interest.adjSrc)]);
    } else if (/휴일|공휴일|비영업일|영업일\s*조정/.test(q) && c.interest) {
      r = say("이자지급일이 영업일이 아닌 경우 그 다음 영업일에 지급하며, 이자는 실제 지급일까지 계산합니다.", [factSrc(c.interest.adjSrc)]);
    } else if (/조기상환|중도상환|페널티|일찍\s*갚/.test(q) && c.prepayFee) {
      r = say(`조기상환수수료는 ${c.prepayFee.text}이며, ${c.prepayFee.withinYears}년 경과 후에는 수수료가 없습니다.`, [factSrc(c.prepayFee.src)]);
    } else if (/(\d+)\s*회차/.test(q) && (c.schedule || []).length) {
      const n = Number(q.match(/(\d+)\s*회차/)[1]);
      const s = c.schedule.find((x) => x.round === n);
      if (s) r = say(`Tranche A ${n}회차 상환금액은 ${s.amount}억원이며 상환예정일은 ${fmt(s.date)}${nextBusinessDay(s.date) !== s.date ? `(비영업일이라 ${fmtW(nextBusinessDay(s.date))} 상환)` : ""}입니다. 약정서 별표 1 기준입니다.`, [factSrc(s.src)]);
    } else if (/Tranche\s*([AB])/i.test(q) && /상환/.test(q) && c.repayment) {
      const k = q.match(/Tranche\s*([AB])/i)[1].toUpperCase();
      const x = c.repayment[k];
      if (x) r = say(`Tranche ${k}는 ${x.method}${k === "A" ? "이며 회차별 금액은 별표 1 분할상환표를 따릅니다" : "로 만기일에 전액 상환합니다"}.`, [factSrc(x.src)]);
    } else if (/금리|이자율/.test(q) && c.rate) {
      r = say(`대출 이자율은 연 ${c.rate.value}% ${c.rate.type}이며 연 ${c.interest ? c.interest.dayCount : 365}일 기준 일할 계산합니다.`, [factSrc(c.rate.src)]);
    } else if (/365|계산\s*기준|일할/.test(q) && c.interest) {
      r = say(`이자는 연 ${c.interest.dayCount}일 기준으로 일할 계산합니다.`, [factSrc(c.rate && c.rate.src)]);
    } else if (/(총|대출)\s*(금액|규모)|트랜치\s*구성/.test(q) && c.amount) {
      r = say(`총 대출금액은 ${c.amount.total}억원이며 Tranche A ${c.amount.trancheA}억원, Tranche B ${c.amount.trancheB}억원으로 구성됩니다.`, [factSrc(c.amount.src)]);
    } else if (/만기/.test(q) && !/만기일시/.test(q) && ev("maturity")) {
      const m = ev("maturity");
      r = say(`대출 만기일은 ${fmtW(m.date)}입니다. 최초 인출일로부터 ${c.maturity.years}년이 되는 날이며, 영업일이 아니면 다음 영업일로 합니다.`, [factSrc(c.maturity.src)]);
    } else if (/인수대금|PC-01/.test(q) && ev("PC-01")) {
      const e = ev("PC-01"), x = c.conditions.find((k) => k.id === "PC-01");
      r = say(`PC-01 인수대금 지급 확인서는 인출일로부터 ${x.deadline.n}${x.deadline.unit} 이내, 즉 ${fmtW(e.date)}까지 제출해야 합니다.`, [factSrc(x.src)]);
    } else if (/질권설정\s*승낙|PC-02/.test(q) && ev("PC-02")) {
      const e = ev("PC-02"), x = c.conditions.find((k) => k.id === "PC-02");
      r = say(`PC-02 질권설정 승낙서와 확정일자 부여 증빙은 인출일로부터 ${x.deadline.n}${x.deadline.unit} 이내, 즉 ${fmtW(e.date)}까지 제출해야 합니다.`, [factSrc(x.src)]);
    } else if (/인출선행|선행조건|CP/.test(q) && (c.conditions || []).length) {
      const cps = c.conditions.filter((x) => x.kind === "CP");
      r = say(`인출선행조건 서류는 ${cps.map((x) => `${x.id} ${x.title}`).join(", ")}입니다.`, [factSrc(cps[0].src), factSrc(cps[cps.length - 1].src)]);
    } else if (/레버리지|이자보상/.test(q) && (c.covenants || []).length) {
      const cv = c.covenants.find((x) => q.includes(x.name.slice(0, 3))) || c.covenants[0];
      r = say(`${cv.name}${cv.formula ? `(${cv.formula})` : ""} 기준은 ${cv.limit.toFixed(1)}배 ${cv.dir}입니다. 연결재무제표 기준이며, 위반 여부 판정은 host가 합니다.`, [factSrc(cv.src)]);
    } else if (/측정기준일|측정일/.test(q) && c.firstTest) {
      r = say(`최초 재무약정 측정기준일은 ${fmt(c.firstTest.date)}이며 이후 매 회계분기 종료일에 측정합니다.`, [factSrc(c.firstTest.src)]);
    } else if (/재무제표|준수확인서|정보제공/.test(q) && c.reporting) {
      const next = events.find((e) => e.type === "정보제공" && e.date >= state.settings.demoDate);
      r = say(`분기 재무제표와 재무약정 준수확인서는 각 회계분기 종료일로부터 ${c.reporting.days}일 이내에 제출하며, 마지막 날이 영업일이 아니면 다음 영업일까지입니다.${next ? ` 가장 가까운 기한은 ${fmtW(next.date)}입니다.` : ""}`, [factSrc(c.reporting.src)]);
    }
  }
  if (!r && /DSCR|원리금상환비율/i.test(q) && rep && rep.dscr.length) {
    const y = (q.match(/(20\d\d)/) || [])[1];
    const d = rep.dscr.find((x) => String(x.year) === y) || rep.dscr[0];
    r = say(`차입금상환검토보고서 기준 ${d.year}년 DSCR(원리금상환비율)은 ${d.value.toFixed(2)}배입니다. 보고서의 참고값이며 판단이 아닙니다.`, [factSrc(d.src)]);
  }
  if (!r) {
    const top = rank(chunks, q, 3);
    if (top.length && top[0].score >= 0.3) {
      const t = top[0];
      const body = t.text.split("\n").filter((l) => !/^제\s*\d+\s*조/.test(l)).slice(0, 3).join(" ");
      const srcs = [{ doc: t.doc, article: t.article, page: t.page, row: t.row, quote: t.text.split("\n").find((l) => !/^제\s*\d+\s*조/.test(l)) || t.text }];
      // Q&A 행이 약정서 조항을 근거로 적어 두었으면 그 조항 원문도 함께 인용
      const qdoc = t.row ? state.docs.find((d) => d.id === t.docId) : null;
      const qrow = qdoc ? qnaRows(qdoc).find((x) => x.row === t.row) : null;
      const art = qrow && String(qrow.srcRef || "").match(/제\s*(\d+)\s*조/);
      const cc = art && chunks.find((k) => k.type === "대출약정서" && new RegExp(`^제${art[1]}조`).test(k.article || ""));
      if (cc) srcs.push({ doc: cc.doc, article: cc.article, page: cc.page, quote: cc.text.split("\n").find((l) => !/^제\s*\d+\s*조/.test(l)) || cc.text });
      r = say(`자료에서 가장 가까운 근거는 다음과 같습니다. ${body}`, srcs);
    }
  }
  if (!r) {
    const cat = categoryOf(q);
    r = { answer: NOT_FOUND, found: false, sources: [], decision, route: { seat: ROUTE[cat], category: cat } };
  }
  if (decision && r.found) r.answer = r.answer + " " + decision.note;
  return r;
}

// 출처 검증: 인용문이 실제로 권한 안 청크에 있어야 한다 → 없으면 지우고 경고
function verifySources(state, seatId, sources) {
  const chunks = buildChunks(state, seatId);
  const ok = [], dropped = [];
  (sources || []).forEach((s) => {
    const qs = squash(s.quote || "");
    const hit = chunks.find((c) => (!s.doc || c.doc === s.doc || c.type === s.docType) && qs && squash(c.text).includes(qs.slice(0, 60)));
    if (hit) ok.push({ ...s, doc: hit.doc, docId: hit.docId, page: hit.page ?? s.page, row: hit.row ?? s.row, article: s.article || hit.article });
    else dropped.push(s);
  });
  return { ok, dropped };
}

// 답변 속 날짜·숫자 재검증: 테이블 데이터(권한 안 청크·계산된 일정)에 없는 값이면 경고
function verifyNumbers(state, seatId, text) {
  const chunks = buildChunks(state, seatId);
  const corpus = squash(chunks.map((c) => c.text).join(" "));
  const evDates = new Set(buildEvents(state).flatMap((e) => [fmt(e.date), fmt(e.raw || e.date)]));
  const warnings = [];
  const seen = new Set();
  (text.match(/\d{4}[.\-]\s?\d{1,2}[.\-]\s?\d{1,2}/g) || []).forEach((t) => {
    const d = dotDate(t.replace(/\s/g, ""));
    if (!d || seen.has(d)) return; seen.add(d);
    if (!evDates.has(fmt(d)) && !corpus.includes(squash(fmt(d)))) warnings.push(`날짜 ${fmt(d)}가 테이블 데이터에 없습니다`);
  });
  (text.match(/\d[\d,.]*\s?(억원|억|%|배)/g) || []).forEach((t) => {
    const v = squash(t).replace(/억원$/, "억");
    if (seen.has(v)) return; seen.add(v);
    const n = v.replace(/(억|%|배)$/, "");
    const unit = v.slice(n.length);
    const variants = [v, n + (unit === "억" ? "억원" : unit), Number(n).toFixed(1) + unit, Number(n).toFixed(2) + unit];
    if (!variants.some((x) => corpus.includes(x))) warnings.push(`숫자 ${t.trim()}가 테이블 데이터에 없습니다`);
  });
  return warnings;
}

/* ───────────── 질문 묶기·라우팅 (규칙 대체판) ───────────── */
const TOPICS = [
  ["이자지급일과 비영업일 조정", "일정", /이자[^.]{0,8}(일|날짜|주기|지급|언제)|첫 이자|\d+일\s*이자/],
  ["조기상환수수료 유무와 요율", "조건·구조", /조기상환|중도상환|페널티|1년 안에 갚/],
  ["Tranche A 상환방식과 회차별 상환금액", "조건·구조", /Tranche\s*A|회차|상환 ?스케줄|상환 원금|원금 상환/],
  ["재무약정 기준과 준수확인서 제출기한", "재무약정", /레버리지|이자보상|재무약정|준수확인서|재무제표|측정일/],
  ["스폰서 추가출자 계획", "실적·경영", /출자|증자|자금 지원/],
  ["질권 대항요건(확정일자) 법률 검토", "법률", /질권|대항/],
];
function clusterRule(questions) {
  const issues = [];
  questions.forEach((q) => {
    let i = TOPICS.findIndex(([, , re]) => re.test(q.text));
    const key = i >= 0 ? TOPICS[i][0] : "기타 문의";
    let issue = issues.find((x) => x.summary === key);
    if (!issue) { issue = { id: "", summary: key, category: i >= 0 ? TOPICS[i][1] : categoryOf(q.text), questionIds: [] }; issues.push(issue); }
    issue.questionIds.push(q.id);
  });
  issues.forEach((x, k) => { x.id = "I" + (k + 1); });
  return { issues };
}

function draftRule(state, issue, seatTo, orgs) {
  const to = (state.seats.find((s) => s.id === seatTo) || {}).org || seatTo;
  return `${to} 담당자님께,\n대주단 ${orgs.length}곳(${orgs.join(", ")})에서 "${issue.summary}" 관련 문의가 접수되었습니다. 현재 테이블에 올라온 자료로는 답변 근거를 찾지 못해 회신을 요청드립니다.\n회신 주시면 질문한 모든 기관에 동시에 배포하고 Q&A 모음집에 반영하겠습니다.\n— 유진투자증권 (DealFlow AI 딜러 초안)`;
}

/* ───────────── 정답표 채점 ───────────── */
function parseAnswerKey(doc) {
  const sheet = (n) => ((doc.sheets || []).find((s) => s.name === n) || { rows: [] }).rows.slice(1).filter((r) => r.some((x) => x !== ""));
  return {
    qa: sheet("qa").map((r) => ({ no: r[0], q: r[1], keywords: String(r[2]).split(",").map((s) => s.trim()).filter(Boolean), source: r[3] })),
    discrepancy: sheet("discrepancy").map((r) => ({ no: r[0], field: r[1], docA: r[2], valueA: r[3], docB: r[4], valueB: r[5] })),
    cluster: sheet("cluster").map((r) => ({ row: Number(r[0]), issue: r[1], label: r[2] })),
    dates: sheet("dates").map((r) => ({ name: r[0], date: String(r[1]).slice(0, 10) })),
  };
}

function gradeQA(item, ans) {
  const text = squash(ans.answer || "");
  const kw = item.keywords.map((k) => ({ k, ok: text.includes(squash(k)) }));
  const [typ, ...art] = String(item.source).split(" ");
  const want = squash(art.join(" "));
  const src = (ans.sources || []).some((s) => {
    const docOk = squash(s.doc || "").includes(squash(typ).slice(0, 4)) || squash(s.docType || "") === squash(typ);
    return docOk && (!want || squash(s.article || "").includes(want));
  });
  return { kw, src, pass: kw.every((x) => x.ok) && src };
}

function gradeDiscrepancy(key, found) {
  return key.map((k) => {
    const hit = found.find((f) => squash(f.field).includes(squash(k.field)) || squash(k.field).includes(squash(f.field)));
    const ok = !!hit && [hit.a.value, hit.b.value].some((v) => squash(v).includes(squash(k.valueB).slice(0, 4)));
    return { ...k, ok, got: hit ? `${hit.a.value} ↔ ${hit.b.value}` : "미탐지" };

async function ask(seatId, question, { silent = false } = {}) {
  const st = store.state;
  const q = normQ(question);
  const profile = E.permProfile(st, seatId);
  const chunks = E.rank(E.buildChunks(st, seatId), q, 6);
  const res = await runTask("answer", `${q}|${profile}`, { question: q, seatRole: roleOf(seatId), chunks: chunks.map(slimChunk), events: E.buildEvents(st).slice(0, 40).map((e) => ({ title: e.title, date: e.date, basis: e.basis })) }, () => E.answerRule(st, seatId, q), safe());
  const a = { ...res.result };
  const v = E.verifySources(st, seatId, a.sources || []);
  const decision = E.detectDecision(q);
  const out = {
    id: uid("a"), q, seat: seatId, engine: res.engine, at: nowIso(),
    answer: a.answer || E.NOT_FOUND, found: a.found !== false && v.ok.length > 0, sources: v.ok,
    warnings: E.verifyNumbers(st, seatId, a.answer || "").concat(v.dropped.length ? [`확인되지 않은 출처 ${v.dropped.length}건을 지웠습니다`] : []),
    decision: decision || a.decision || null,
  };
  if (!out.found) {
    out.answer = E.NOT_FOUND;
    const cat = E.categoryOf(q);
    out.route = a.route || { seat: E.ROUTE[cat], category: cat };
    out.warnings = [];
  }
  if (!silent) { store.ui.asks[seatId] = [out, ...(store.ui.asks[seatId] || [])].slice(0, 12); notify(); }
  return out;
}

  audit("host", "초기화", "테이블을 처음 상태로 되돌렸습니다");
  commit([{ type: "reset" }]);
}
