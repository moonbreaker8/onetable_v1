  const d = a.due ? `<span class="chip ${a.dday <= 3 && a.dday >= 0 ? "red" : lv} num">${a.dday >= 0 ? "D-" + a.dday : "D+" + -a.dday}</span>` : `<span class="chip ${lv}">${esc(a.kind)}</span>`;
  return `<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--line-2);flex-wrap:nowrap">${d}<div class="grow small break">${esc(a.text)}${a.due ? ` <span class="faint num">${E.fmt(a.due)}</span>` : ""}</div></div>`;
}

function seatPopover(st, seatId, me, x, y) {
  const s = st.seats.find((k) => k.id === seatId);
  if (!s) return "";
  const left = Math.min(Math.max(16, x - 140), window.innerWidth - 296);
  const top = Math.min(y + 12, window.innerHeight - 260);
  return `<div class="popover" style="left:${left}px;top:${top}px">
    <div class="row" style="flex-wrap:nowrap">${avatar(s)}<div class="grow"><b>${esc(s.org)}</b><div class="muted small">${E.ROLE_LABEL[s.role]}${s.person ? ` · ${esc(s.person)} ${esc(s.title || "")}` : ""}</div></div></div>
    ${s.phone ? `<div class="small muted" style="margin-top:8px">${esc(s.phone)} · ${esc(s.email)}</div>` : `<div class="small faint" style="margin-top:8px">테이블명단이 올라오면 연락처가 채워집니다</div>`}
    <div class="stack" style="margin-top:12px">
      <button class="btn primary" style="width:100%" data-act="sit" data-seat="${s.id}" ${s.id === me ? "disabled" : ""}>${s.id === me ? "지금 앉아 있는 자리" : "이 자리로 앉기"}</button>
      <div class="row" style="flex-wrap:nowrap"><button class="btn sm grow" data-act="msg-seat" data-seat="${s.id}">메시지</button><button class="btn sm grow" data-act="copy-mail" data-seat="${s.id}">메일 초안 복사</button></div>
    </div></div>`;
}

/* ───────────── 자료 ───────────── */
function seatStrip(st) {
  return `<div class="strip"><div class="dl" data-anchor="dealer"><img src="${ASSET.symbol}" alt=""><small>딜러</small></div><span class="arrow">→</span>
    ${st.seats.map((s) => `<div class="s" data-anchor="${s.id}">${avatar(s)}<small>${esc(s.org.replace(/^가상\s*/, ""))}</small></div>`).join("")}</div>`;
}

const docSummary = (d) => {
  const x = d.extracted || {};
  if (d.type === "대출약정서") return `${ab("CP")} ${(x.conditions || []).filter((c) => c.kind === "CP").length} · ${ab("PC")} ${(x.conditions || []).filter((c) => c.kind === "PC").length} · 상환 ${(x.schedule || []).length}회차 · 재무약정 ${(x.covenants || []).length}`;
  if (d.type === "티저") return `조기상환수수료 ${x.prepayFee ? esc(x.prepayFee.text) : "-"} · 금리 ${x.rate ? `${x.rate.min}~${x.rate.max}%` : "-"}`;
  if (d.type === "차입금상환검토보고서") return `상환 ${(x.schedule || []).length}회차 · ${ab("DSCR")} ${(x.dscr || []).map((v) => v.value.toFixed(2)).join(" / ")}`;
  if (d.type === "Q&A모음집") { const r = E.qnaRows(d); return `${r.length}행 · 미답변 ${r.filter((k) => !k.a).length}행`; }
  if (d.type === "대주단질문로그") return `질문 ${E.logRows(d).length}건`;
  if (d.type === "테이블명단") return `${E.rosterRows(d).length}자리`;
  if (d.type === "이사회의사록") return `${(d.pages || []).reduce((n, p) => n + p.lines.length, 0)}줄`;
  return "";
};
const pagesOf = (d) => (d.kind === "xlsx" ? `${(d.sheets || []).length}시트` : `${(d.pages || []).length}쪽`);

function viewDocs(st, ui) {
  const role = E.seatRole(st.seats, ui.seat);
  const isHost = role === "host";
  const disc = E.findDiscrepancies(st);
  const proc = ui.processing.slice(0, 8).map((p) => {
    const order = ["분류", "추출", "배분", "완료"];
    const at = order.indexOf(p.step);
    return `<div class="proc"><div class="ellipsis"><b class="small">${esc(p.name)}</b> ${p.type ? `<span class="tiny muted">→ ${esc(p.type)}</span>` : ""}</div>
      <div class="steps">${["분류", "추출", "배분"].map((s, i) => `<span class="${at > i ? "done" : at === i ? "now" : ""}">${s}${i === 0 && p.engines.classify ? " · " + ENGINE_LABEL[p.engines.classify] : ""}${i === 1 && p.engines.extract ? " · " + ENGINE_LABEL[p.engines.extract] : ""}</span>`).join("")}</div></div>`;
  }).join("");
  const docs = st.docs.map((d) => {
    const ok = E.canSee(st.matrix, role, d.type);
    if (!ok) return `<div class="card doc locked"><div class="t"><div class="ic">🔒</div><div class="grow"><b>권한 밖 자료</b><div class="small muted">${esc(d.type)} · 이 자리에는 내용·근거 인용이 차단됩니다</div></div></div></div>`;
    const seen = st.seats.filter((s) => E.canSee(st.matrix, s.role, d.type)).length;
    const pub = st.matrix[d.type][role] === "public";
    return `<div class="card doc"><div class="t"><div class="ic">${d.kind === "xlsx" ? "XLS" : "PDF"}</div><div class="grow" style="min-width:0"><div class="row" style="gap:6px"><span class="chip grey">${esc(d.type)}</span>${engChip(d.typeEngine)}</div><b class="small break" style="display:block;margin-top:4px">${esc(d.name)}</b></div></div>
      <div class="small muted">${pagesOf(d)} · ${docSummary(d)}</div>
      ${d.typeNote ? `<div class="tiny" style="color:var(--amber)">${esc(d.typeNote)}</div>` : ""}
      ${pub ? `<div class="tiny" style="color:var(--amber)">공개범위=전체인 행만 보입니다</div>` : ""}
      <div class="row between"><span class="tiny muted">열람 ${seen}/${st.seats.length}자리${d.extractEngine ? " · 추출 " + ENGINE_LABEL[d.extractEngine] : ""}</span><button class="btn sm" data-act="view-doc" data-doc="${d.id}">원문 보기</button></div></div>`;
  }).join("");
  const conds = st.conditions.map((c) => {
    const pill = { "미제출": "grey", "보완 필요": "warn", "적합 후보": "info", "확정 완료": "ok" }[c.status] || "grey";
    const rv = c.review;
    return `<div class="cond"><div class="id">${esc(c.id)}</div><div><b class="small">${esc(c.title)}</b><div class="small muted break">${esc(c.desc)}</div>
      ${rv ? `<div class="checks">${rv.checks.map((k) => `<span class="chip ${k.ok ? "ok" : "danger"}">${k.ok ? "✓" : "✗"} ${esc(k.label)}${k.page ? ` · p.${k.page}` : ""}</span>`).join("")}</div><div class="small" style="margin-top:6px;color:${rv.status === "보완 필요" ? "var(--amber)" : "var(--muted)"}">${esc(rv.guide)} <span class="faint">(${esc(rv.docName)})</span></div>` : ""}
      ${c.deadline ? `<div class="tiny faint">기한: 인출일 + ${c.deadline.n}${c.deadline.unit}</div>` : ""}</div>
      <div class="stack" style="text-align:right"><span class="chip ${pill}">${esc(c.status)}</span>${isHost && c.status === "적합 후보" ? `<button class="btn sm primary" data-act="confirm-cond" data-id="${c.id}">확정</button><div>${player()}</div>` : ""}</div></div>`;
  }).join("");
  const roles = ["host", "lender", "borrower", "sponsor", "counsel"];
  const mxRows = E.TYPE_NAMES.map((t) => `<tr><td data-l="문서"><b class="small">${esc(t)}</b></td>${roles.map((r) => {
    const v = st.matrix[t][r];
    const cls = v === "public" ? "p" : v ? "o" : "x";
    return `<td data-l="${E.ROLE_LABEL[r]}"><button class="${cls}" ${isHost && r !== "host" ? `data-act="mx" data-type="${esc(t)}" data-role="${r}"` : "disabled"}>${v === "public" ? "공개분" : v ? "O" : "🔒"}</button></td>`;
  }).join("")}</tr>`).join("");
  return `
  <div class="page-h"><div><h1>자료</h1><div class="sub">업로드 → AI 분류·추출 → 권한 있는 자리로 배분. 권한 밖 자료는 🔒로만 보입니다.</div></div>
    <div class="row"><button class="btn primary" data-act="load-samples">샘플 자료 불러오기</button><label class="btn">파일 선택<input type="file" multiple hidden data-act="file" accept=".pdf,.xlsx,.xls,.docx,.txt,.csv"></label></div></div>
  ${disc.length ? `<div class="alert red" style="margin-bottom:14px"><span>⚠</span><div class="grow">자료 간 불일치 <b>${disc.length}건</b>이 탐지됐습니다. 어느 쪽이 맞는지는 AI가 판단하지 않습니다.</div><a class="btn sm" href="#issues">불일치 보기</a></div>` : ""}
  <div class="card" style="margin-bottom:14px"><div class="drop" data-drop>여기에 파일을 끌어다 놓으세요 · PDF / XLSX / DOCX</div>
    ${seatStrip(st)}${proc ? `<div style="margin-top:6px">${proc}</div>` : ""}</div>
  ${st.docs.length ? `<div class="docs">${docs}</div>` : `<div class="card empty"><b>아직 올라온 자료가 없습니다</b>[샘플 자료 불러오기]를 누르면 sample_docs/의 임시 예시자료 8종이 순서대로 처리됩니다.</div>`}
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="card-h"><h2>${ab("CP")}·${ab("PC")} 체크리스트</h2><span class="tiny muted">약정서에서 자동 생성 · 확정은 host만</span></div>
      ${conds || `<div class="empty small">약정서가 올라오면 인출선행조건·후행조건이 자동으로 만들어집니다.</div>`}</div>
    <div class="card"><div class="card-h"><h2>문서 × 자리 공개 매트릭스</h2><span class="tiny muted">${isHost ? "눌러서 변경 (O → 공개분 → 🔒)" : "host만 변경할 수 있습니다"}</span></div>
      <div class="tbl-wrap"><table class="tbl mx cards"><thead><tr><th>문서</th>${roles.map((r) => `<th>${E.ROLE_LABEL[r]}</th>`).join("")}</tr></thead><tbody>${mxRows}</tbody></table></div></div>
  </div>${foot()}`;
}

/* ───────────── 질문 ───────────── */
const DEFAULT_SUGG = ["첫 이자지급일은 언제인가요?", "조기상환수수료가 있나요?", "Tranche A 상환방식은 어떻게 되나요?", "인수대금 지급 확인서 제출기한은 언제인가요?", "레버리지비율 기준은 몇 배인가요?", "2027년 DSCR은 얼마로 검토됐나요?"];

function answerCard(st, a, opts = {}) {
  const seat = st.seats.find((s) => s.id === a.seat) || { org: a.seat, role: "lender" };
  const dec = a.decision;
  const routeSeat = dec ? dec.routeTo : a.route ? a.route.seat : null;
  return `<div class="card ans ${a.found ? "" : "nf"}">
    <div class="row between" style="margin-bottom:6px"><div class="row" style="gap:6px">${opts.showSeat ? `<span class="chip grey">${esc(seat.org)} 자리</span>` : ""}${engChip(a.engine)}${a.warnings.length ? `<span class="chip warn" title="${esc(a.warnings.join("\n"))}">⚠ 재검증 경고 ${a.warnings.length}</span>` : a.found ? `<span class="chip ok" title="답변 속 날짜·숫자를 규칙 엔진이 테이블 데이터와 대조했습니다">✓ 날짜·숫자 재검증</span>` : ""}</div><span class="tiny faint">${fmtTime(a.at).slice(6)}</span></div>
    ${opts.hideQ ? "" : `<div class="q">Q. ${esc(a.q)}</div>`}
    <div class="a">${esc(a.answer)}</div>
    ${a.warnings.length ? `<div class="small" style="color:var(--amber);margin-top:6px">${a.warnings.map(esc).join("<br>")}</div>` : ""}
    ${a.sources.length ? `<div class="srcs">${srcChips(a.sources)}</div>` : ""}
    ${dec ? `<div class="alert ${dec.type === "legal" ? "info" : "warn"}" style="margin-top:10px"><span>⚖</span><div class="grow small">${esc(dec.note)}</div></div>` : ""}
    ${routeSeat && (dec || !a.found) && !opts.compact ? `<div class="row" style="margin-top:10px"><button class="btn sm primary" data-act="send-req" data-to="${routeSeat}" data-q="${esc(a.q)}">${!a.found ? "담당 자리에 요청" : "요청 보내기"} → ${esc((st.seats.find((s) => s.id === routeSeat) || {}).org || routeSeat)}</button></div>` : ""}
  </div>`;
}

function viewAsk(st, ui, sugg) {
  const role = E.seatRole(st.seats, ui.seat);
  const tab = role === "host" ? ui.askTab : "ask";
  const seg = role === "host" ? `<div class="seg"><button class="${tab === "ask" ? "on" : ""}" data-act="ask-tab" data-tab="ask">딜러에게 묻기</button><button class="${tab === "board" ? "on" : ""}" data-act="ask-tab" data-tab="board">질문 보드</button></div>` : "";
  if (tab === "board") return `<div class="page-h"><div><h1>질문</h1><div class="sub">들어온 질문을 쟁점으로 묶고, 자료로 답할 수 있으면 자동답변, 아니면 담당 자리로 넘깁니다.</div></div>${seg}</div>${viewBoard(st, ui)}${foot()}`;
  const asks = ui.asks[ui.seat] || [];
  let list = "";
  if (ui.compare && ui.compareSet) {
    const set = ui.compareSet;
    list = `<div class="card" style="margin-bottom:12px"><div class="card-h"><h3>같은 질문, 자리별 답변</h3><span class="tiny muted">자리 권한 안 문서만 근거로 씁니다</span></div><div class="q" style="font-weight:700;margin-bottom:10px">Q. ${esc(set.q)}</div>
      <div class="cmp">${set.answers.map((a) => answerCard(st, a, { showSeat: true, hideQ: true, compact: true })).join("")}</div></div>`;
  }
  list += asks.map((a) => answerCard(st, a)).join("");
  return `
  <div class="page-h"><div><h1>질문</h1><div class="sub">딜러가 이 자리(<b>${esc((st.seats.find((s) => s.id === ui.seat) || {}).org)}</b>)가 볼 수 있는 자료만 근거로 답하고 출처를 붙입니다.</div></div>${seg}</div>
  <div class="card stack" style="margin-bottom:14px">
    <div class="sugg">${sugg.map((q) => `<button data-act="ask-sugg" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <form class="ask-box" data-act="ask-form"><textarea class="input" name="q" rows="2" placeholder="예: 다음 이자지급일과 내야 할 서류는?" aria-label="질문"></textarea><button class="btn primary" type="submit">묻기</button></form>
    <label class="switch"><input type="checkbox" data-act="compare" ${ui.compare ? "checked" : ""}> 다른 자리에서 같은 질문 보기 <span class="tiny muted">(host · 대주단 · 법무법인)</span></label>
  </div>
  ${list || `<div class="card empty"><b>무엇이든 물어보세요</b>근거를 찾지 못하면 "현재 테이블에 올라온 자료에서는 찾을 수 없습니다."라고 답하고 담당 자리로 요청을 넘깁니다.</div>`}
  ${foot()}`;
}

function viewBoard(st, ui) {
  const qs = st.questions;
  const iss = st.issues;
  const auto = iss.filter((i) => i.status === "자동답변").length;
  const human = iss.filter((i) => i.status === "요청중" || i.status === "회신완료").length;
  const replied = st.requests.filter((r) => r.repliedAt && r.kind === "issue");
  const avg = replied.length ? Math.max(1, Math.round(replied.reduce((n, r) => n + (new Date(r.repliedAt) - new Date(r.createdAt)), 0) / replied.length / 60000)) : null;
  const lenders = st.seats.filter((s) => s.role === "lender");
  const seen = ui.seenQ;
  const stream = qs.slice().reverse().map((q) => {
    const s = st.seats.find((k) => k.id === q.seat) || { role: "lender", org: q.org };
    const isNew = !seen.has(q.id);
    seen.add(q.id);
    return `<div class="qi ${isNew ? "new" : ""}">${avatar(s)}<div><div class="meta">${esc(q.org)} · ${esc(q.channel)} · ${esc(String(q.at).slice(11))} ${q.issueId ? `<span class="iss">→ ${esc(q.issueId)}</span>` : ""}</div>${esc(q.text)}</div></div>`;
  }).join("");
  const seenI = ui.seenI;
  const issues = iss.map((i) => {
    const cls = i.status === "자동답변" ? "auto" : i.status === "요청중" ? "routed" : i.status === "회신완료" ? "done" : "";
    const orgs = [...new Set(i.questionIds.map((id) => (qs.find((q) => q.id === id) || {}).org))];
    const to = i.routeTo ? st.seats.find((s) => s.id === i.routeTo) : null;
    const isNew = !seenI.has(i.id + i.status); seenI.add(i.id + i.status);
    const badge = { "정리됨": `<span class="chip grey">정리됨</span>`, "자동답변": `<span class="chip ok">AI 자동답변 · ${orgs.length}곳 동시 배포</span>`, "요청중": `<span class="chip warn">→ ${esc(to ? to.org : "")} 요청함</span>`, "회신완료": `<span class="chip info">회신 · ${orgs.length}곳 동시 배포</span>` }[i.status];
    return `<div class="card issue ${cls} ${isNew ? "new" : ""}" style="padding:12px 14px">
      <div class="row between"><div class="row" style="gap:6px"><b>${esc(i.id)}</b><span class="chip grey">${esc(i.category)}</span>${badge}</div><div class="row" style="gap:4px">${engChip(i.engine)}${i.status === "회신완료" ? player() : dealer()}</div></div>
      <div style="font-weight:700;margin-top:6px">${esc(i.summary)} <span class="muted small">· 질문 ${i.questionIds.length}건 · ${orgs.map(esc).join(", ")}</span></div>
      ${i.answer ? `<div class="small" style="margin-top:6px">${esc(i.answer)}</div>${i.note ? `<div class="small" style="margin-top:4px;color:var(--amber)">${esc(i.note)}</div>` : ""}<div class="row" style="gap:6px;margin-top:6px">${srcChips(i.sources)}</div>` : ""}
      ${i.status === "요청중" ? `<div class="small muted" style="margin-top:6px">자료에 근거가 없어 ${esc(to ? to.org : "")} 자리에 회신을 요청했습니다. 딜러가 쓴 요청 초안은 담당 자리 요청함에 있습니다.</div>` : ""}
      ${i.reply ? `<div class="alert ok" style="margin-top:8px"><span>↩</span><div class="small grow"><b>${esc((st.seats.find((s) => s.id === i.repliedBy) || {}).org)} 회신</b> · ${esc(i.reply)}</div></div>` : ""}
    </div>`;
  }).join("");
  const can = { play: st.logRows.length > 0, cluster: qs.length > 0 && !iss.length, triage: iss.some((i) => i.status === "정리됨") };
  return `
  <div class="counters" style="margin-bottom:12px">
    <div class="c"><b>${qs.length}</b><span>들어온 질문</span></div><div class="c"><b>${iss.length}</b><span>묶인 쟁점</span></div>
    <div class="c hl"><b>${auto}</b><span>AI 자동답변</span></div><div class="c"><b>${human}</b><span>사람에게 넘긴 쟁점</span></div>
    <div class="c"><b>${avg === null ? "—" : avg + "분"}</b><span>평균 회신시간</span></div></div>
  <div class="card" style="margin-bottom:12px"><div class="row between"><div class="lenders">${lenders.map((s) => `<div class="s" data-anchor="${s.id}">${avatar(s)}<small>${esc(s.org.replace(/^가상\s*/, ""))}</small>${qs.filter((q) => q.seat === s.id).length ? `<span class="n">${qs.filter((q) => q.seat === s.id).length}</span>` : ""}</div>`).join("")}</div>
    <div class="row"><button class="btn sm" data-act="play-q" ${can.play ? "" : "disabled title='대주단질문로그를 먼저 올리세요'"}>① 질문 몰려오기 재생</button><button class="btn sm" data-act="cluster" ${can.cluster ? "" : "disabled"}>② 딜러가 묶기</button><button class="btn sm primary" data-act="triage" ${can.triage ? "" : "disabled"}>③ 자동답변·라우팅</button></div></div>
    ${!st.logRows.length ? `<div class="small muted" style="margin-top:6px">05_대주단질문로그.xlsx가 올라오면 재생할 수 있습니다. (자료 → 샘플 자료 불러오기)</div>` : ""}</div>
  <div class="board">
    <div class="card"><div class="card-h"><h3>들어온 질문 <span class="muted small">메일·전화·메신저</span></h3>${dealer()}</div><div class="stream">${stream || `<div class="empty small">아직 들어온 질문이 없습니다.</div>`}</div></div>
    <div><div class="card-h" style="margin-bottom:8px"><h3>쟁점</h3><span class="tiny muted">묶기·배포는 딜러, 회신은 플레이어</span></div><div class="stack">${issues || `<div class="card empty small">질문을 묶으면 쟁점 카드가 여기에 생깁니다.</div>`}</div></div>
  </div>`;
}

/* ───────────── 요청함 ───────────── */
function viewInbox(st, ui) {
  const me = ui.seat;
  const role = E.seatRole(st.seats, me);
  const reqs = st.requests.filter((r) => r.to === me);
  const notes = (st.inbox[me] || []).filter((n) => n.kind !== "요청");
  const reqCards = reqs.map((r) => `<div class="card req ${r.status === "회신완료" ? "done" : ""}" data-req="${r.id}">
    <div class="row between"><div class="row" style="gap:6px"><span class="chip ${r.status === "회신완료" ? "ok" : "warn"}">${esc(r.status)}</span><b>${esc(r.title)}</b></div><div class="row" style="gap:4px">${engChip(r.engine)}<span class="tiny faint">${fmtTime(r.createdAt)}</span></div></div>
    <div class="small muted" style="margin:6px 0">${esc(r.from)}에서 · ${esc(r.body || "")}</div>
    ${r.questions ? `<details style="margin-bottom:8px"><summary class="small" style="cursor:pointer">원 질문 ${r.questions.length}건 보기</summary><ul class="small muted" style="margin:6px 0 0;padding-left:18px">${r.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul></details>` : ""}
    <div class="row" style="gap:6px;margin-bottom:6px">${r.kind === "issue" ? dealer() + `<span class="tiny muted">요청 초안</span>` : ""}</div>
    <div class="draft">${esc(r.draft || r.body)}</div>
    ${r.reason ? `<div class="tiny muted" style="margin-top:6px">넘긴 이유: ${esc(r.reason)}</div>` : ""}
    ${r.status === "회신완료"
      ? `<div class="alert ok" style="margin-top:10px"><span>↩</span><div class="grow small"><b>회신 완료</b> · ${esc(r.reply)}<div class="tiny">${fmtTime(r.repliedAt)} · 질문한 모든 기관에 동시 배포${r.issueId ? " · Q&A 모음집 자동 갱신" : ""}</div></div></div>`
      : `<form class="stack" style="margin-top:10px" data-act="reply-form" data-id="${r.id}"><textarea class="input" name="reply" placeholder="회신 내용을 입력하세요. 회신하면 질문한 모든 기관에 동시에 배포됩니다." aria-label="회신"></textarea><div class="row between"><span>${player()}</span><button class="btn primary" type="submit">회신 · 동시 배포</button></div></form>`}
  </div>`).join("");
  const noteCards = notes.map((n) => `<div class="card note ${n.read ? "" : "unread"}" style="padding:12px 14px"><div class="row between"><div class="row" style="gap:6px"><span class="kind" style="color:${n.kind === "회신" ? "var(--green)" : "var(--blue)"}">${n.kind === "회신" ? "↩ 회신 도착" : "✦ 딜러 답변 도착"}</span>${n.read ? "" : `<span class="chip red">새 알림</span>`}${engChip(n.engine)}</div><span class="tiny faint">${fmtTime(n.at)}</span></div>
    <b style="display:block;margin-top:4px">${esc(n.title)}</b><div class="small break" style="white-space:pre-wrap;margin-top:4px">${esc(n.body)}</div>${(n.sources || []).length ? `<div class="row" style="gap:6px;margin-top:8px">${srcChips(n.sources)}</div>` : ""}</div>`).join("");
  let hostPart = "";
  if (role === "host") {
    const all = st.requests;
    hostPart = `<div class="card" style="margin-top:14px"><div class="card-h"><h2>보낸 요청 현황</h2><button class="btn sm" data-act="export-qna">Q&amp;A 모음집 내보내기 (xlsx)</button></div>
      ${all.length ? `<table class="tbl cards"><thead><tr><th>요청</th><th>받는 자리</th><th>상태</th><th>시각</th></tr></thead><tbody>${all.map((r) => `<tr><td data-l="요청">${esc(r.title)}</td><td data-l="받는 자리">${esc((st.seats.find((s) => s.id === r.to) || {}).org || r.to)}</td><td data-l="상태"><span class="chip ${r.status === "회신완료" ? "ok" : "warn"}">${esc(r.status)}</span></td><td data-l="시각" class="num small">${fmtTime(r.repliedAt || r.createdAt)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty small">보낸 요청이 없습니다.</div>`}
      ${st.qnaAdded.length ? `<div class="alert ok" style="margin-top:12px"><span>＋</span><div class="small grow">Q&amp;A 모음집에 <b>${st.qnaAdded.length}행</b>이 자동 추가됐습니다: ${st.qnaAdded.map((r) => `${r.row}행 「${esc(r.q)}」 (${esc(r.srcRef)})`).join(" · ")}</div></div>` : ""}</div>`;
  }
  return `<div class="page-h"><div><h1>요청함</h1><div class="sub">이 자리로 온 요청에 회신하면 질문한 모든 기관에 동시 배포됩니다. 실제 메일·문자는 보내지 않습니다.</div></div></div>
  <div class="grid g2"><div><div class="card-h"><h2>나에게 온 요청 <span class="muted small">${reqs.filter((r) => r.status !== "회신완료").length}건 대기</span></h2></div><div class="stack">${reqCards || `<div class="card empty small">이 자리로 온 요청이 없습니다.</div>`}</div></div>
  <div><div class="card-h"><h2>도착한 답변·회신</h2></div><div class="stack">${noteCards || `<div class="card empty small">도착한 답변이 없습니다.</div>`}</div></div></div>
  ${hostPart}${foot()}`;
}

/* ───────────── 일정 ───────────── */
function viewCalendar(st, ui) {
  const events = E.buildEvents(st);
  const [y, m] = ui.calMonth.split("-").map(Number);
  const first = E.ymd(y, m, 1);
  const start = E.addDays(first, -E.weekday(first));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = E.addDays(start, i);
    if (i >= 35 && Number(d.slice(5, 7)) !== m) break;
    const evs = events.filter((e) => e.date === d);
    const hol = E.holidayName(d);
    cells.push(`<div class="d ${Number(d.slice(5, 7)) !== m ? "out" : ""} ${hol ? "hol" : ""} ${E.weekday(d) === 0 ? "sun" : ""} ${d === st.settings.demoDate ? "today" : ""}"><span class="dn">${Number(d.slice(8))}</span>${hol ? `<span class="hn">${esc(hol)}</span>` : ""}${evs.map((e) => `<button class="ev t-${e.type}" data-act="ev" data-key="${e.key}" title="${esc(e.title)}">${esc(e.title.replace(/^\d{4}년\s*/, ""))}</button>`).join("")}</div>`);
  }
  const monthEv = events.filter((e) => e.date.startsWith(ui.calMonth));
  const alerts = E.alertsFor(st, ui.seat);
  const prev = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, "0")}`;
  const next = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, "0")}`;
  return `<div class="page-h"><div><h1>일정</h1><div class="sub">약정서에서 뽑은 규칙으로 규칙 엔진이 계산합니다 (영업일·공휴일 조정 포함). 일정을 누르면 산출근거가 보입니다.</div></div>
    <label class="row small">기준일 <input class="input" style="width:auto" type="date" value="${st.settings.demoDate}" data-act="demo-date"></label></div>
  <div class="card" style="margin-bottom:14px"><div class="card-h"><h2>사후관리 알림 · ${esc((st.seats.find((s) => s.id === ui.seat) || {}).org)}</h2><span class="tiny muted">기준일로부터 14일 내 일정 · 기한 경과 · 보완 필요 서류 · 미회신 요청</span></div>
    ${alerts.length ? alerts.map(alertRow).join("") : `<div class="empty small">챙길 알림이 없습니다.</div>`}</div>
  ${events.length ? `<div class="card"><div class="card-h"><div class="row"><button class="btn sm" data-act="cal" data-m="${prev}" aria-label="이전 달">‹</button><h2 class="num">${y}년 ${m}월</h2><button class="btn sm" data-act="cal" data-m="${next}" aria-label="다음 달">›</button></div>
    <div class="row" style="gap:4px">${["이자", "상환", "후행조건", "재무약정", "만기"].map((t) => `<span class="chip t-${t}">${t}</span>`).join("")}</div></div>
    <div class="cal">${["일", "월", "화", "수", "목", "금", "토"].map((d) => `<div class="dh">${d}</div>`).join("")}${cells.join("")}</div>
    <div style="margin-top:14px">${monthEv.map((e) => `<div class="evrow" data-act="ev" data-key="${e.key}"><span class="num small"><b>${E.fmtW(e.date)}</b></span><div class="small break"><span class="chip t-${e.type}">${e.type}</span> ${esc(e.title)}${e.adjNote ? `<div class="tiny" style="color:var(--amber)">영업일 조정: ${esc(e.adjNote)}</div>` : ""}</div><span class="tiny muted">${esc(ownerLabel(st, e.owner))}</span></div>`).join("") || `<div class="empty small">이 달에는 일정이 없습니다.</div>`}</div></div>`
    : `<div class="card empty"><b>약정서가 아직 없습니다</b>약정서를 올리면 이자·상환·후행조건·재무약정·정보제공·만기 일정이 자동으로 만들어집니다.</div>`}
  ${foot()}`;
}
const ownerLabel = (st, role) => { const s = st.seats.find((k) => k.role === role); return s ? `${s.org} (${E.ROLE_LABEL[role]})` : role; };

function eventModal(st, key) {
  const e = E.buildEvents(st).find((x) => x.key === key);
  if (!e) return "";
  return modal(e.title, `<div class="stack">
    <div class="row"><span class="chip t-${e.type}">${e.type}</span><b class="num" style="font-size:18px">${E.fmtW(e.date)}</b></div>
    ${e.adjNote ? `<div class="alert warn"><span>↪</span><div class="small">영업일 조정: ${esc(e.adjNote)}</div></div>` : ""}
    <table class="tbl"><tbody>
      <tr><th>산출근거</th><td>${esc(e.basis)}</td></tr>
      <tr><th>계산 규칙</th><td>규칙 엔진 (공휴일표 + 영업일 조정) — LLM이 계산하지 않음</td></tr>
      <tr><th>담당 자리</th><td>${esc(ownerLabel(st, e.owner))}</td></tr>
      <tr><th>필요 증빙</th><td>${esc(e.evidence)}</td></tr>
      <tr><th>완료 기준</th><td>${esc(e.criteria)}</td></tr>
      ${e.dscrRef ? `<tr><th>${ab("DSCR")}</th><td><b class="num">${e.dscrRef.value.toFixed(2)}배</b> (${e.dscrRef.year}년) <span class="chip warn">참고: 보고서 기준, 판단 아님</span><div style="margin-top:6px">${srcChip(e.dscrRef.src)}</div></td></tr>` : ""}
    </tbody></table></div>`, "sm");
}

/* ───────────── 불일치 ───────────── */
function viewIssues(st, ui) {
  const items = E.findDiscrepancies(st);
  const role = E.seatRole(st.seats, ui.seat);
  const sent = (id) => st.requests.some((r) => r.kind === "discrepancy" && r.discId === id);
  return `<div class="page-h"><div><h1>불일치</h1><div class="sub">약정서·티저·Q&amp;A 답변·상환검토보고서에서 추출한 같은 항목을 규칙 코드로 비교합니다. LLM은 비교하지 않습니다(추출만).</div></div><span class="chip eng-rule">규칙 엔진 비교</span></div>
  <div class="alert red" style="margin-bottom:14px"><span>⚖</span><div><b>어느 쪽이 맞는지는 AI가 판단하지 않습니다.</b> host와 법무법인 확인이 필요합니다.</div></div>
  <div class="stack">${items.map((d) => `<div class="card"><div class="row between"><div class="row"><span class="chip red">${esc(d.id)}</span><h3>${esc(d.field)}</h3></div>${sent(d.id) ? `<span class="chip ok">확인 요청 보냄</span>` : ""}</div>
    <div class="grid g2" style="margin-top:10px">
      <div class="card" style="box-shadow:none;background:#FAFBFC"><div class="tiny muted">문서 A</div><b class="small break">${esc(d.a.doc)}</b><div style="font-size:18px;font-weight:800;margin:4px 0">${esc(d.a.value)}</div>${srcChip(d.a.src)}</div>
      <div class="card" style="box-shadow:none;background:#FAFBFC"><div class="tiny muted">문서 B</div><b class="small break">${esc(d.b.doc)}</b><div style="font-size:18px;font-weight:800;margin:4px 0;color:var(--danger)">${esc(d.b.value)}</div>${srcChip(d.b.src)}</div></div>
    ${role === "host" ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-act="disc-req" data-id="${d.id}" data-to="host">host 확인 요청</button><button class="btn sm" data-act="disc-req" data-id="${d.id}" data-to="counsel">법무법인 확인 요청</button></div>` : ""}</div>`).join("") || `<div class="card empty"><b>탐지된 불일치가 없습니다</b>약정서와 비교할 자료(티저·Q&amp;A·상환검토보고서)가 올라오면 자동으로 대조합니다.</div>`}</div>${foot()}`;
}

/* ───────────── 검증 ───────────── */
function viewCheck(st, ui) {
  const r = ui.checkResult;
  const card = (label, got, total, sub) => `<div class="card score ${got === total ? "full" : ""}"><b>${got}/${total}</b><span>${label}</span>${sub ? `<div class="tiny faint">${sub}</div>` : ""}</div>`;
  let body = `<div class="card empty"><b>정답표로 정확도를 공개합니다</b>answer_key/정답표.xlsx의 qa·discrepancy·cluster·dates 시트로 자동 채점합니다. (같은 채점을 터미널에서 <span class="kbd">npm run check</span>)</div>`;
  if (r && r.error) body = `<div class="alert warn"><span>!</span><div>${esc(r.error)}</div></div>`;
  else if (r) {
    const n = (a) => a.filter((x) => x.ok ?? x.pass).length;
    body = `<div class="grid g4">${card("질의응답", n(r.qa), r.qa.length, "키워드 + 근거 조항")}${card("불일치 탐지", n(r.disc), r.disc.length, `추가 탐지 ${r.extra}건`)}${card("질문 묶기", r.clu.correct, r.clu.total, `쟁점 ${r.clu.issues}/${r.clu.goldIssues}`)}${card("일정", n(r.dates), r.dates.length, "영업일 조정 포함")}</div>
    <div class="card" style="margin-top:14px"><div class="card-h"><h2>질의응답 상세</h2></div><table class="tbl cards"><thead><tr><th>#</th><th>질문</th><th>기대 키워드</th><th>근거</th><th>엔진</th><th>결과</th></tr></thead><tbody>${r.qa.map((x) => `<tr><td data-l="#" class="num">${x.no}</td><td data-l="질문">${esc(x.q)}</td><td data-l="키워드">${x.kw.map((k) => `<span class="chip ${k.ok ? "ok" : "danger"}">${esc(k.k)}</span>`).join(" ")}</td><td data-l="근거"><span class="chip ${x.src ? "ok" : "danger"}">${esc(x.source)}</span></td><td data-l="엔진">${engChip(x.engine)}</td><td data-l="결과">${x.pass ? "✅" : "❌"}</td></tr>`).join("")}</tbody></table></div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-h"><h2>불일치</h2></div><table class="tbl cards"><thead><tr><th>항목</th><th>정답</th><th>탐지</th><th></th></tr></thead><tbody>${r.disc.map((x) => `<tr><td data-l="항목">${esc(x.field)}</td><td data-l="정답">${esc(x.valueA)} ↔ ${esc(x.valueB)}</td><td data-l="탐지">${esc(x.got)}</td><td data-l="">${x.ok ? "✅" : "❌"}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><div class="card-h"><h2>일정</h2></div><table class="tbl cards"><thead><tr><th>일정</th><th>정답일</th><th>계산</th><th></th></tr></thead><tbody>${r.dates.map((x) => `<tr><td data-l="일정">${esc(x.name)}</td><td data-l="정답일" class="num">${E.fmt(x.date)}</td><td data-l="계산" class="num">${E.fmt(x.got)}</td><td data-l="">${x.ok ? "✅" : "❌"}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card" style="margin-top:14px"><div class="card-h"><h2>질문 묶기</h2></div><table class="tbl cards"><thead><tr><th>쟁점</th><th>질문 수</th><th>정답 쟁점</th><th>일치</th></tr></thead><tbody>${r.clu.detail.map((d) => `<tr><td data-l="쟁점">${esc(d.id)} ${esc(d.summary)}</td><td data-l="질문 수" class="num">${d.size}</td><td data-l="정답 쟁점">${esc(d.mapped)}</td><td data-l="일치" class="num">${d.hit}/${d.size}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `<div class="page-h"><div><h1>검증</h1><div class="sub">정답표 자동 채점 — 시연 중 정확도를 공개합니다.</div></div><button class="btn primary" data-act="run-check">채점 실행</button></div>${body}${foot()}`;
}

/* ───────────── 기록·설정·디버그 ───────────── */
function viewLog(st, ui) {
  if (E.seatRole(st.seats, ui.seat) !== "host") return `<div class="page-h"><h1>기록</h1></div><div class="card empty"><b>🔒 감사로그는 host만 볼 수 있습니다</b></div>${foot()}`;
  return `<div class="page-h"><div><h1>기록</h1><div class="sub">감사로그 — 누가 언제 무엇을 했는지 모두 남깁니다.</div></div></div>
  <div class="card"><table class="tbl cards"><thead><tr><th>시각</th><th>주체</th><th>동작</th><th>내용</th></tr></thead><tbody>${st.audit.map((a) => `<tr><td data-l="시각" class="num small">${fmtTime(a.at)}</td><td data-l="주체">${esc(a.actor)}</td><td data-l="동작"><b class="small">${esc(a.action)}</b></td><td data-l="내용" class="small">${esc(a.detail)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">기록 없음</td></tr>`}</tbody></table></div>${foot()}`;

      ui.modal = { type: "viewer", docId: d.id, target: src }; renderOverlay(); break;
    }
    case "confirm-cond": if (S.confirmCondition(t.dataset.id, ui.seat)) toast(`${t.dataset.id} 확정 — 플레이어가 결정했습니다`, "ok"); break;
    case "mx": {
      const cur = s.matrix[t.dataset.type][t.dataset.role];
      const order = t.dataset.type === "Q&A모음집" ? [true, "public", false] : [true, false];
      const next = order[(order.indexOf(cur) + 1) % order.length];
      S.setMatrix(t.dataset.type, t.dataset.role, next, ui.seat); break;
    }
    case "ask-tab": ui.askTab = t.dataset.tab; render(true); break;
    case "ask-sugg": await askNow(t.dataset.q); break;
    case "send-req": {
      const to = t.dataset.to, q = t.dataset.q;
      S.sendRequest({ to, title: q, body: `${S.seatOf(ui.seat).org} 자리 질문: "${q}"\n테이블 자료로는 딜러가 답을 확정할 수 없어 회신을 요청드립니다.`, fromSeat: ui.seat });
      toast(`${S.seatOf(to).org} 요청함으로 보냈습니다`, "ok"); break;
    }
    case "play-q": await S.playQuestions(); break;
    case "cluster": await S.clusterQuestions(); break;
    case "triage": await S.triageIssues(500); break;
    case "export-qna": await exportQna(); break;
    case "cal": ui.calMonth = t.dataset.m; render(true); break;
    case "ev": ui.modal = { type: "event", key: t.dataset.key }; renderOverlay(); break;
    case "disc-req": {
      const d = E.findDiscrepancies(s).find((x) => x.id === t.dataset.id);
      if (!d) break;
      S.sendRequest({ to: t.dataset.to, title: `불일치 확인: ${d.field}`, body: `${d.a.doc}: ${d.a.value}\n${d.b.doc}: ${d.b.value}\n어느 쪽이 맞는지 확인 부탁드립니다. (AI는 판단하지 않습니다)`, fromSeat: ui.seat, kind: "discrepancy", discId: d.id });
      toast(`${S.seatOf(t.dataset.to).org} 요청함으로 보냈습니다`, "ok"); break;
    }
    case "run-check": await runCheck(); break;
  }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  const act = t.dataset && t.dataset.act;
  if (act === "file") { await ingestFiles([...t.files]); t.value = ""; }
  if (act === "compare") { ui.compare = t.checked; if (!t.checked) ui.compareSet = null; render(true); }
  if (act === "safe") { st().settings.safeMode = t.checked; S.audit("host", "데모 안전모드", t.checked ? "ON" : "OFF"); S.commit(); toast(`데모 안전모드 ${t.checked ? "ON — 캐시 우선" : "OFF"}`); }
  if (act === "demo-date" && t.value) { st().settings.demoDate = t.value; S.commit(); }
});
document.addEventListener("focusout", () => setTimeout(() => { if (ui.pendingRender && !typing()) render(); }, 0));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (ui.modal || ui.pop || ui.menu)) { ui.modal = null; ui.pop = null; ui.menu = null; renderOverlay(); } });

// 드래그앤드롭
document.addEventListener("dragover", (e) => { const z = e.target.closest && e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const z = e.target.closest && e.target.closest("[data-drop]"); if (z) z.classList.remove("over"); });
document.addEventListener("drop", async (e) => { const z = e.target.closest && e.target.closest("[data-drop]"); if (!z) return; e.preventDefault(); z.classList.remove("over"); await ingestFiles([...e.dataTransfer.files]); });

/* ───────────── 시연용 묶음 동작 ───────────── */
async function loadAllSamples(gap = 350, only = null) {
  const names = (await sampleNames()).filter((n) => !only || only.some((o) => n.startsWith(o)));
  for (const n of names) { await ingestSample(n); if (gap) await sleep(gap); }
  toast(`자료 ${names.length}건을 처리해 자리별로 배분했습니다`, "ok");
}
async function loadEverything() {
  toast("전체 시연 데이터를 불러옵니다…");
  const names = await sampleNames();
  for (const n of names) await ingestSample(n);
  if (st().logRows.length && !st().questions.length) { await S.playQuestions(0); await S.clusterQuestions(); await S.triageIssues(0); }
  toast("전체 시연 데이터를 불러왔습니다 (회신 단계 ④부터 이어서 시연)", "ok");
}

/* ───────────── 효과: 카드 배분·도착 알림 ───────────── */
function anchor(id) {
  const els = [...document.querySelectorAll(`[data-anchor="${id}"]`)].filter((el) => el.offsetParent !== null);
  return els[0] || null;
}
function dealCards(fx) {
  const from = anchor("dealer");
  if (!from) return;
  const fr = from.getBoundingClientRect();
  fx.seats.forEach((sid, i) => {
    const to = anchor(sid);
    if (!to) return;
    const tr = to.getBoundingClientRect();
    const card = document.createElement("div");
    card.className = "fly";
    card.textContent = fx.label.replace("차입금상환검토보고서", "상환검토").replace("대주단질문로그", "질문로그").slice(0, 8);
    document.body.appendChild(card);
    const x0 = fr.left + fr.width / 2 - 23, y0 = fr.top + fr.height / 2 - 30;
    const x1 = tr.left + tr.width / 2 - 23, y1 = tr.top + tr.height / 2 - 30;
    card.animate([
      { transform: `translate(${x0}px, ${y0}px) rotate(-8deg) scale(.7)`, opacity: 0 },
      { transform: `translate(${x0}px, ${y0 - 10}px) rotate(0) scale(1)`, opacity: 1, offset: 0.15 },
      { transform: `translate(${x1}px, ${y1}px) rotate(${(i % 2 ? 1 : -1) * 6}deg) scale(.55)`, opacity: 0.9 },
    ], { duration: 720, delay: i * 55, easing: "cubic-bezier(.3,.7,.2,1)", fill: "forwards" }).onfinish = () => card.remove();
  });
  fx.locked.forEach((sid, i) => {
    const to = anchor(sid);
    if (!to) return;
    const tr = to.getBoundingClientRect();
    const l = document.createElement("div");
    l.className = "lockpop"; l.textContent = "🔒";
    l.style.left = tr.left + tr.width / 2 - 9 + "px"; l.style.top = tr.top - 6 + "px";
    document.body.appendChild(l);
    l.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "translateY(0)", offset: 0.3 }, { opacity: 0 }], { duration: 1000, delay: 300 + i * 40 }).onfinish = () => l.remove();
  });
}
function pulseSeats() {
  const ids = st().seats.map((s) => s.id);
  ids.forEach((id, i) => setTimeout(() => {
    const el = anchor(id);
    if (!el) return;
    el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  }, i * 180));
}
S.store.fxListeners.add((fxs) => {
  fxs.forEach((fx) => {
    if (fx.type === "deal") requestAnimationFrame(() => dealCards(fx));
    if (fx.type === "intro") pulseSeats();
    if (fx.type === "q" && fx.seat) { const el = anchor(fx.seat); if (el) { el.classList.remove("ping"); void el.offsetWidth; el.classList.add("ping"); } }
    if (fx.type === "arrive" && fx.seats.includes(ui.seat)) toast(`${fx.from ? `↩ ${fx.from} 회신 도착` : "✦ 딜러 답변 도착"} · ${fx.title}`, fx.from ? "ok" : "");
    if (fx.type === "route" && fx.seats.includes(ui.seat)) toast(`✉ 요청 도착 · ${fx.title}`, "red");
  });
});

/* ───────────── 다른 창(스테이지)에서 오는 명령 ───────────── */
async function handleCommand(cmd) {
  if (cmd.seat && cmd.seat !== ui.seat) setSeat(cmd.seat);
  if (cmd.type === "nav") { if (cmd.askTab) ui.askTab = cmd.askTab; go(cmd.route); }
  if (cmd.type === "autoreply") {
    const req = st().requests.find((r) => r.to === ui.seat && r.status !== "회신완료");
    if (!req) return;
    go("inbox"); await sleep(300);
    const form = document.querySelector(`form[data-act="reply-form"][data-id="${req.id}"]`);
    if (form) {
      form.scrollIntoView({ block: "center", behavior: "smooth" });
      await sleep(400);
      for (let i = 1; i <= cmd.text.length; i += 2) { form.reply.value = cmd.text.slice(0, i); await sleep(cmd.cps || 18); }
      form.reply.value = cmd.text; await sleep(500);
    }
    S.replyRequest(req.id, cmd.text, ui.seat);
    toast("회신을 질문한 모든 기관에 동시 배포했습니다", "ok");
  }
  if (cmd.type === "ask") {
    ui.compare = !!cmd.compare; go("ask"); await sleep(250);
    const ta = document.querySelector('form[data-act="ask-form"] textarea');
    if (ta) { for (let i = 1; i <= cmd.q.length; i++) { ta.value = cmd.q.slice(0, i); await sleep(28); } await sleep(300); ta.value = ""; }
    await askNow(cmd.q, !!cmd.compare);
  }
  if (cmd.type === "grade") { go("check"); await sleep(200); await runCheck(); }
  if (cmd.type === "intro") { go("home"); await sleep(300); pulseSeats(); }
}
window.addEventListener("message", (e) => { if (e.data && e.data.oneTable && (e.origin === location.origin || location.protocol === "file:")) handleCommand(e.data.cmd); });

/* ───────────── 시작 ───────────── */
async function boot() {
  S.loadSaved();
  if (!st().seats.some((s) => s.id === ui.seat)) ui.seat = "host";
  S.store.listeners.add(() => render());
  onBusy((n) => { ui.busy = n; if (!typing()) { const h = document.querySelector(".hdr .busy"); if (!!h !== !!n) render(); } });
  await wireBrowserAI(toast);
  render(true);
  loadAnswerKey().then(() => { if (ui.route === "ask") render(); });
  if (!EMBED_FRAME) mountDemo({ ui, go, setSeat, toast, render, handleCommand, ingestSample, sampleNames, loadEverything, runCheck, wordmark: V.ASSET.wordmark });
}
boot();

return { ui, toast, render, go, setSeat, sampleNames, sampleDoc, ingestSample, askNow, runCheck, loadAllSamples, loadEverything, handleCommand };
})();
</script>
